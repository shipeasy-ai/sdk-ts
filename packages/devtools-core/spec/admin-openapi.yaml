    get:
      operationId: listOpsItems
      summary: List the operational queue
      description: |-
        Returns the unified ops queue (bugs, feature requests, errors, alerts, measurement plans) in work order — highest priority first, oldest first within a priority — so consumers work it top-down. Filter by `type` and/or `status`, and cap with `limit`. Human-gated holding states (items awaiting human sign-off in the dashboard) are never returned by `all`/default status.

        **Use case:** Pull the open queue to triage — e.g. every `bug` still `open` — before working items down one by one.
      tags:
        - Ops
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: type
          in: query
          required: false
          description: Filter by item type, or `all` (the default). Every type a returned item can carry is filterable, including the auto-filed ones.
          schema:
            default: all
            anyOf:
              - type: string
                enum:
                  - bug
                  - feature_request
                  - error
                  - alert
                  - measure_plan
                description: Queue item type. `bug` and `feature_request` are user-fileable; `error`, `alert`, and `measure_plan` tickets are auto-filed by the platform.
              - type: string
                const: all
        - name: status
          in: query
          required: false
          description: Filter by lifecycle status, or `all` (the default). The human-gated holding state (`pending_approval`) is excluded from `all`/default and returned only when requested as the exact status.
          schema:
            default: all
            anyOf:
              - $ref: '#/components/schemas/OpsItemStatus'
              - type: string
                const: all
        - name: limit
          in: query
          required: false
          description: Max items to return (1–500). Defaults to 200.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - name: owner
          in: query
          required: false
          description: Narrow to items owned by one person OR one agent. Matches a person by `users.id`, email, or display name, and an agent by connector id, display name, or kebab-case handle — e.g. `owner=Claude` or `owner=alice@acme.dev`. Case-insensitive exact match, applied over the returned page.
          schema:
            type: string
      responses:
        '200':
          description: List the operational queue
          content:
            application/json:
              schema:
