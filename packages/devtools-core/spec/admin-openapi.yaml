          $ref: '#/components/schemas/MetricDefaultMinEffectOfInterest'
        direction:
          $ref: '#/components/schemas/MetricDirection'
        unit:
          $ref: '#/components/schemas/MetricDisplayUnit'
        display:
          $ref: '#/components/schemas/MetricDisplayConfig'
