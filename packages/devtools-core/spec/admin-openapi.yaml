          description: Stable per-escalation key (e.g. `feedback:7`) so re-runs dedupe to one row.
          type: string
      required:
        - title
        - summary
      additionalProperties: false
      description: Body for `POST /api/admin/notifications`. In `title`, `summary`, and each step, reference admin entities inline with tokens — `#42` (feedback item), `@gate:<name>` (alias `@flag:`), `@experiment:<name>` (`@exp:`), `@config:<name>`, `@killswitch:<name>` (`@ks:`), `@metric:<name>`, `@universe:<name>`, `@alert:<name>` — where `<name>` is the entity's immutable name/slug (e.g. `features.checkout`). The dashboard renders each token as a live hover chip deep-linking to the entity; tokens degrade to plain text elsewhere, so they're always safe to use.
    NotifyOpsResponse:
      type: object
      properties:
        dedupeKey:
          type: string
          description: The dedupe key the escalation was recorded under.
        dispatched:
          type: boolean
          description: '`true` if a new escalation was dispatched; `false` on an idempotent repeat.'
      required:
        - dedupeKey
        - dispatched
      additionalProperties: false
      description: Response for `POST /api/admin/notifications`.
    ListSlackChannelsResponse:
      type: object
      properties:
        connected:
          type: boolean
          description: Whether a Slack connector is connected and authenticated.
        channels:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Slack channel id.
              name:
                type: string
                description: Slack channel name (without the leading `#`).
              isPrivate:
                description: Whether the channel is private.
                type: boolean
            required:
