    patch:
      operationId: updateConfig
      summary: Update a dynamic config
      description: |-
        Partial update. When `value` is supplied it is **republished on every env** (new version per env). A per-env key (`dev`/`staging`/`prod`) publishes a new version to **only that env**, immediately, overriding `value` for it. When `schema` is supplied it replaces the current schema; every existing value is re-validated.

        **Use cases**

        - **Republish flat value** — `{ "value": {…} }` sets the same value on every env.
        - **Publish one env** — `{ "prod": {…} }` publishes a new version to prod only, instantly.
        - **Schema migration** — `{ "schema": {…} }` replaces the schema; existing values are re-validated.
      tags:
        - Configs
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: id
          in: path
          required: true
          description: Stable opaque config id (`cfg_…`) or the config's `name`.
          schema:
            $ref: '#/components/schemas/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConfigRequest'
            examples:
              flatValue:
                summary: Flat value — republish on every env
                description: Sets the same JSON object as a new version on dev/stage/prod.
                value:
                  value:
                    tiers:
                      - name: free
                      - name: pro
              prodOnly:
                summary: Per-env — publish prod only
                description: Publishes a new version to prod only, immediately. dev/staging untouched.
                value:
                  prod:
                    tiers:
                      - name: free
                      - name: pro
                      - name: enterprise
              schemaOnly:
                summary: Schema-only update
                description: Replaces the schema. Existing values must still validate or the update fails.
                value:
                  schema:
                    type: object
                    properties:
                      tiers:
                        type: array
                      trial_days:
                        type: integer
                    required:
                      - tiers
      responses:
        '200':
          description: Update a dynamic config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateConfigResponse'
              example:
                id: cfg_01j7wae5h6j7k8l9m0n1p2q3r4
        '400':
