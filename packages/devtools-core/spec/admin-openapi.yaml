        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-error-codes:
        - BAD_REQUEST
        - UNAUTHORIZED
        - FORBIDDEN
      x-cli:
        name: list
    post:
      operationId: pushI18nKeys
      summary: Push i18n keys (insert-only, or `force` to overwrite)
      description: |-
        Add NEW keys to a profile. Insert-only by default — existing keys are left untouched and reported back as `skipped`.

        Pass `force: true` to overwrite the existing ones in bulk with the submitted values: they come back as `updated` instead of `skipped`. Without `force` the only overwrite paths are `updateI18nKey` (one key) and the devtools-only `upsertI18nKeys`.

        **Use case:** Seed newly-extracted keys without clobbering translations already in the profile — or re-push a whole source-language file with `force` after the copy changed.
      tags:
        - Keys
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushI18nKeysRequest'
            example:
              profile_id: i18n_01j7w8a1b2c3
              keys:
                - key: checkout.cta
                  value: Buy now
      responses:
        '201':
          description: Push i18n keys (insert-only, or `force` to overwrite)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushI18nKeysResponse'
              example:
                added:
                  - checkout.cta
                skipped: []
                updated: []
                pushed_count: 1
                skipped_count: 0
                updated_count: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-error-codes:
        - BAD_REQUEST
        - UNAUTHORIZED
        - FORBIDDEN
        - ALREADY_EXISTS
        - VALIDATION
      x-cli:
        name: push
    put:
      operationId: upsertI18nKeys
      summary: Bulk upsert i18n keys (overwrite)
      description: |-
        Bulk upsert keys into a profile — existing keys ARE overwritten, new ones inserted. The profile's KV snapshot is rebuilt and the CDN purged before the call returns, so the edits go live on their own.

        This is the overwrite counterpart of the insert-only `pushI18nKeys`. It backs the devtools overlay's in-product "Apply changes" label editing and is deliberately not surfaced by the CLI or MCP — those surfaces only expose the insert-only push so a whole `en.json` can't wholesale-overwrite prod.

        **Use case:** Apply a batch of in-product label edits (devtools overlay) in one call.
      tags:
        - Keys
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertI18nKeysRequest'
            example:
              profile_id: 3f1a6c2e-1b2c-4d5e-8f90-0a1b2c3d4e5f
              keys:
                - key: checkout.cta
                  value: Buy it now
      responses:
        '200':
          description: Bulk upsert i18n keys (overwrite)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertI18nKeysResponse'
              example:
                upserted: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
