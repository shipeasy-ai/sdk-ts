    OpsRunAction:
      type: string
      enum:
        - link_pr
        - notify
        - status
        - superseded
      description: The final action that closed a run record — `link_pr`/`notify` are the agent's terminal ops actions, `status` a completion status flip (ready_for_qa/resolved), `superseded` a newer ack replacing an open run.
    OpsRunActionOrNull:
      anyOf:
        - $ref: '#/components/schemas/OpsRunAction'
        - type: 'null'
      description: Which final action closed the run, or `null` while it is open (or a non-run record).
    OpsRun:
      type: object
      properties:
        id:
          type: string
          description: Run record id.
        agent:
          anyOf:
            - type: string
            - type: 'null'
          description: The AI agent type working the run (`jarvis` | `claude` | `cursor` | `copilot` | `jules`); `null` for a human ack.
        connectorId:
          anyOf:
            - type: string
            - type: 'null'
          description: The trigger-connector row id backing the acking agent; `null` for a human ack or the built-in Jarvis agent.
        ackedBy:
          anyOf:
            - type: string
            - type: 'null'
          description: Email of the human who acked; `null` for an AI ack.
        sessionId:
          anyOf:
            - type: string
            - type: 'null'
          description: The agent-run session id recorded on the ack (dashboard deep-links to the run page), or `null`.
        sessionUrl:
          anyOf:
            - type: string
            - type: 'null'
          description: 'The run''s session-page deep link, or `null`. DERIVED (never stored): rebuilt from `sessionId` + the run''s trigger connector — Claude''s routine id (`?trigger=`), Copilot''s repo (`/tasks/`), Cursor/Jules from the id alone.'
        startedAt:
          type: string
          description: ISO-8601 timestamp the run started (the ack time).
        completedAt:
          anyOf:
            - type: string
            - type: 'null'
          description: ISO-8601 timestamp the run closed, or `null` while still open.
        completedAction:
          $ref: '#/components/schemas/OpsRunActionOrNull'
