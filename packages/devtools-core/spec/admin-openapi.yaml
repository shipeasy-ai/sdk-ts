      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: profile_id
          in: query
          required: false
          description: Profile id to list keys for.
          schema:
            type: string
        - name: prefix
          in: query
          required: false
          description: Only keys whose name starts with this.
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Free-text search — matches keys whose name, value, OR description contains this substring (case-insensitive). Use it to find the key behind a piece of on-screen copy.
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          description: Max keys to return (1–500). Defaults to 200.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - name: offset
          in: query
          required: false
          description: Number of keys to skip before returning `limit` rows (offset pagination).
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List i18n keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListI18nKeysResponse'
              example:
                keys:
                  - id: key_01j7
                    key: checkout.cta
                    value: Buy now
        '400':
          $ref: '#/components/responses/BadRequest'
