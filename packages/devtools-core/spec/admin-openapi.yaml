            id:
              type: string
            name:
              type: string
              maxLength: 128
              pattern: ^[a-z0-9](?:[a-z0-9_-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9_-]*[a-z0-9])?)?$
              description: Stable experiment key. Single segment or `folder.name` (a-z, 0-9, `_`/`-`; max 128 chars). Used by SDKs as `Shipeasy.getExperiment(user, '<name>')`. Immutable after create.
            status:
              type: string
              enum:
                - draft
                - running
                - stopped
                - archived
          required:
            - id
            - name
            - status
          additionalProperties: false
        series:
          type: array
          items:
            $ref: '#/components/schemas/ExperimentResultRow'
          description: Every daily analysis slice (same row shape as `/results`), oldest to newest.
      required:
        - experiment
        - series
      additionalProperties: false
    ReanalyzeExperimentResponse:
      type: object
      properties:
        id:
          type: string
        queued:
          type: boolean
          description: '`true` when the analysis job was enqueued; `false` when the worker enqueue failed or the analysis queue is not configured (retry later).'
      required:
        - id
        - queued
      additionalProperties: false
    CreateExperimentReadoutRequest:
      type: object
      description: Body for `POST /api/admin/experiments/{id}/readouts`. Mints an immutable, dated readout snapshot of the current results view — "this is what we saw when we decided".
      properties:
        kind:
          type: string
          enum:
            - manual
            - ship
            - stop
          description: Why the snapshot is being minted — `manual` ("Share readout"), or automatically on `ship` / `stop`.
        acknowledgedCaveatIds:
          type: array
          items:
            type: string
            description: Caveat id, as surfaced in the results view's caveat list.
          description: Ids of the open caveats the caller ticked (decision-gating acknowledgment). Unlisted caveats are stored as unacknowledged.
        requireAllAcknowledged:
          type: boolean
          description: When `true`, refuse (`422`) to mint while any open caveat is not listed in `acknowledgedCaveatIds` — server-side ship gating.
      required:
        - kind
      additionalProperties: false
    CreateExperimentReadoutResponse:
      type: object
      properties:
        id:
          type: string
          description: Id of the newly minted readout snapshot.
      required:
        - id
      additionalProperties: false
    ExperimentReadoutMetric:
      type: object
      description: Frozen per-metric numbers as rendered at mint time. Display-shaped, not row-shaped — the snapshot keeps rendering exactly what was decided on even if derivations change later.
      properties:
        name:
          type: string
          description: Metric name.
        role:
          type: string
          enum:
            - goal
            - guardrail
            - secondary
          description: Metric role at mint time. `goal` drives the decision, `guardrail` blocks ship if degraded, `secondary` is informational.
        delta:
          description: Absolute difference vs. control (metric units), or `null`.
          anyOf:
            - type: number
            - type: 'null'
        deltaPct:
          description: Relative difference vs. control in percent, or `null`.
          anyOf:
            - type: number
            - type: 'null'
        ci:
          description: Two-item `[low, high]` confidence interval on the delta at the project's configured confidence, or `null`.
          anyOf:
            - type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
            - type: 'null'
        p:
          description: p-value vs. control, or `null`.
          anyOf:
            - type: number
            - type: 'null'
        sig:
          type: boolean
          description: Whether the metric was statistically significant at mint time.
        pass:
          type: boolean
          description: Guardrail pass/fail at mint time. Omitted for metrics where pass/fail doesn't apply.
      required:
        - name
        - role
        - delta
        - deltaPct
        - ci
        - p
        - sig
      additionalProperties: false
    ExperimentReadoutCaveat:
      type: object
      description: One caveat from the results view, frozen with its acknowledgment state at mint time.
      properties:
        id:
          type: string
          description: Stable caveat id.
        severity:
          type: string
          enum:
            - info
            - warn
            - danger
          description: Caveat severity as rendered in the results view.
        text:
          type: string
          description: Human-readable caveat text.
        acknowledged:
          type: boolean
          description: Whether the caller ticked this caveat when minting (decision-gating acknowledgment).
      required:
        - id
        - severity
        - text
        - acknowledged
      additionalProperties: false
    ExperimentReadoutApiRow:
      type: object
      description: An immutable, dated readout snapshot — the frozen results view captured when a decision was made. Never updated after insert.
      properties:
        id:
          type: string
          description: Stable readout id.
        experimentId:
          type: string
          description: Id of the experiment the snapshot belongs to.
        experimentName:
          type: string
          description: Experiment name at mint time (denormalised — survives renames).
        kind:
          type: string
          enum:
            - manual
            - ship
            - stop
          description: Why the snapshot was minted — `manual` ("Share readout"), or automatically on `ship` / `stop`.
        createdBy:
          type: string
          description: Email of the actor who minted the snapshot.
        createdAt:
          type: string
          description: ISO-8601 mint timestamp.
        verdict:
          type: string
          description: Server-computed verdict at mint time (e.g. `ship`, `hold`, `wait`, `invalid`).
        title:
          type: string
          description: Headline of the results view at mint time.
        why:
          type: string
          description: One-line explanation backing the verdict at mint time.
        configHash:
          type: string
          description: sha-256 hex over the assignment-relevant config (salt, groups, allocation, universe, gate) — the snapshot is only comparable to the live view while this hash still matches.
        metricsJson:
          description: Frozen per-metric numbers as rendered at mint time, or `null` for legacy rows without a metrics slice.
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/ExperimentReadoutMetric'
            - type: 'null'
        caveatsJson:
          description: The caveat list with its acknowledgment state at mint time, or `null` for legacy rows without one.
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/ExperimentReadoutCaveat'
            - type: 'null'
        usersJson:
          description: Enrollment at mint time — per-group sample sizes plus the number of days the experiment had been running — or `null` when not captured.
          anyOf:
            - type: object
              properties:
                groups:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Group label.
                      'n':
                        type: number
                        description: Enrolled units in the group at mint time.
                    required:
                      - name
                      - 'n'
                    additionalProperties: false
                    description: One group's enrollment at mint time.
                  description: Per-group enrollment counts.
                days:
                  type: number
                  description: Days the experiment had been running at mint time.
              required:
                - groups
                - days
              additionalProperties: false
            - type: 'null'
      required:
        - id
        - experimentId
        - experimentName
        - kind
        - createdBy
        - createdAt
        - verdict
        - title
        - why
        - configHash
        - metricsJson
        - caveatsJson
        - usersJson
      additionalProperties: false
    ListConfigsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Stable opaque config id (`cfg_…`).
              name:
                type: string
                maxLength: 128
                description: Stable config key in `folder.name` form (two lowercase segments separated by a dot, e.g. `pricing.tiers`). Used by SDKs as `Shipeasy.getConfig('<name>')`. Immutable after create.
              description:
                anyOf:
                  - type: string
                  - type: 'null'
              folder:
                description: Folder segment used for dashboard organisation, or `null` when the config lives at the root.
                anyOf:
                  - type: string
                  - type: 'null'
              schema:
                type: object
                additionalProperties: {}
                description: JSON Schema (draft 2020-12) describing the shape of the config value. Top-level `type` must be `'object'`; every published value is validated against this schema.
              creatorEmail:
                description: Resolved email of the creator (`created_by` → `users.email`), or `null` when unknown. List-only enrichment — present on `GET /api/admin/configs` rows, absent from the by-id detail — so it is optional, never required.
                anyOf:
                  - type: string
                  - type: 'null'
              createdAt:
                description: ISO-8601 creation timestamp, or `null` on legacy rows. List-only enrichment — present on `GET /api/admin/configs` rows, absent from the by-id detail — so it is optional, never required.
                anyOf:
                  - type: string
                  - type: 'null'
              updatedAt:
                type: string
                description: ISO-8601 timestamp of last mutation.
              envs:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    version:
                      type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                      description: Monotonically increasing version per env.
                    publishedAt:
                      type: string
                      description: ISO-8601 publish timestamp.
                    publishedBy:
                      type: string
                      description: Email/id of the actor who published this version.
                  required:
                    - version
                    - publishedAt
                    - publishedBy
                  additionalProperties: false
                description: Per-env latest published version metadata.
              drafts:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    updatedAt:
                      type: string
                      description: ISO-8601 last-edit timestamp on the draft.
                    authorEmail:
                      type: string
                      description: Email/id of the actor who last edited the draft.
                    baseVersion:
                      type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                      description: Published version the draft was forked from.
                  required:
                    - updatedAt
                    - authorEmail
                    - baseVersion
                  additionalProperties: false
                description: Per-env active drafts (if any).
              values:
                description: Per-env latest published values (only returned by `GET /{id}`, not list).
                type: object
                additionalProperties: {}
              draftValues:
                description: Per-env draft values (only returned by `GET /{id}`).
                type: object
                additionalProperties: {}
            required:
              - id
              - name
              - description
              - folder
              - schema
              - updatedAt
              - envs
              - drafts
            additionalProperties: false
        next_cursor:
          anyOf:
            - type: string
            - type: 'null'
      required:
        - data
        - next_cursor
      additionalProperties: false
