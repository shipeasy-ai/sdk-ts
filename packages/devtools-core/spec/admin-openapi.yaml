    DeleteMetricResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required:
        - ok
      additionalProperties: false
      description: Soft-delete (archive) acknowledgement.
    UpdateMetricWithQuery:
      type: object
      properties:
        display_name:
          $ref: '#/components/schemas/MetricDisplayName'
        folder:
          $ref: '#/components/schemas/Folder'
        event_name:
          $ref: '#/components/schemas/MetricEventName'
        query:
          $ref: '#/components/schemas/MetricQueryDsl'
        winsorize_pct:
          $ref: '#/components/schemas/MetricWinsorizePct'
