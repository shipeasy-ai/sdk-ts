    UpdateMetricFields:
      type: object
      properties:
        display_name:
          $ref: '#/components/schemas/MetricDisplayName'
        folder:
          $ref: '#/components/schemas/Folder'
        event_name:
          $ref: '#/components/schemas/MetricEventName'
        winsorize_pct:
          $ref: '#/components/schemas/MetricWinsorizePct'
        default_min_effect_of_interest:
          $ref: '#/components/schemas/MetricDefaultMinEffectOfInterest'
        direction:
          $ref: '#/components/schemas/MetricDirection'
        unit:
          $ref: '#/components/schemas/MetricDisplayUnit'
        display:
          $ref: '#/components/schemas/MetricDisplayConfig'
      additionalProperties: false
      description: Update-metric variant that leaves the query untouched (metadata-only edit — folder, event, winsorisation, default minimum effect of interest, direction, display unit, band and projection).
    UpdateMetricRequest:
      oneOf:
        - $ref: '#/components/schemas/UpdateMetricWithQuery'
        - $ref: '#/components/schemas/UpdateMetricWithQueryIr'
        - $ref: '#/components/schemas/UpdateMetricFields'
      description: Body for `PATCH /api/admin/metrics/{id}`. Every field is optional (`name` is immutable); provide at most one of `query` / `query_ir` — modelled as a `oneOf` of three disjoint strict variants (query-only, query_ir-only, or neither), so supplying both is rejected.
    ListMetricExperimentsResponse:
      type: object
      description: Experiments that attach this metric, ordered with running experiments first, then by role weight (goal > guardrail > secondary), then by name.
      properties:
        experiments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Stable opaque experiment id.
              name:
                type: string
                description: Experiment name.
              status:
                type: string
                enum:
                  - draft
                  - running
                  - stopped
                  - archived
                description: Experiment lifecycle status.
              role:
                type: string
                enum:
                  - goal
                  - guardrail
                  - secondary
                description: Role this metric plays in the experiment. `goal` drives the decision, `guardrail` blocks ship if degraded, `secondary` is informational.
            required:
              - id
              - name
              - status
              - role
            additionalProperties: false
            description: One experiment attaching this metric.
          description: Every experiment (any status) attaching this metric.
      required:
        - experiments
      additionalProperties: false
    UnarchiveMetricResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required:
        - ok
      additionalProperties: false
      description: Unarchive (undo soft-delete) acknowledgement.
    GetMetricSeriesRequest:
      type: object
      description: Time window for the metric series. Bounds are epoch **seconds** (Analytics Engine stores the event timestamp in seconds). `to` must be strictly greater than `from`.
      properties:
        from:
          type: integer
          minimum: 0
          description: Window start, epoch seconds (inclusive).
        to:
          type: integer
          minimum: 0
          description: Window end, epoch seconds (exclusive). Must be greater than `from`.
        bucket:
          type: integer
          minimum: 60
          maximum: 86400
          default: 3600
          description: Bucket width in seconds (60s–86400s/1d). Defaults to `3600` (hourly). Each returned point is floor-aligned to this width.
      required:
        - from
        - to
      additionalProperties: false
    GetMetricSeriesResponse:
      type: object
      description: Bucketed values for one metric, compiled from its typed IR and executed against the Analytics Engine SQL API, plus the SQL that produced them. Capped at 5000 rows (high-cardinality `groupBy` series are truncated).
      properties:
        sql:
          type: string
          description: The Analytics Engine SQL executed to produce `rows` (echoed for transparency / debugging).
        rows:
          type: array
          description: Bucketed series, ordered by `t` ascending. For a metric with a `groupBy` clause each bucket has one row per label combination, with the label values as extra string/number properties on the row.
          items:
            type: object
            properties:
              t:
                type: integer
                description: Bucket start, epoch seconds, floor-aligned to `bucket`.
              v:
                type: number
                description: Aggregated metric value in the bucket (sample-interval weighted).
              lo:
                type: number
                description: |
                  Lower edge of the seasonal band — what this hour of the week normally holds, `sigma` below the median of the four weeks before the window. Present only for a metric whose `display.band` is on, and always alongside `hi`.
              hi:
                type: number
                description: |
                  Upper edge of the seasonal band. Present only for a metric whose `display.band` is on, and always alongside `lo`. A point outside `[lo, hi]` is exactly a bucket an `anomaly` alert rule at the same sigma would breach on — the band a chart draws and the condition a rule fires on come from one fit.
            required:
              - t
              - v
            additionalProperties: true
      required:
        - sql
        - rows
      additionalProperties: false
    ListEventsResponse:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            description: Stable opaque event id.
          name:
            type: string
            description: Event name — the handle metric queries reference.
          folder:
            anyOf:
              - description: 'Optional folder name used to group items in the dashboard. Part of the SDK lookup key: an item in folder `checkout` named `new-cart` is referenced as `checkout/new-cart` from the SDK.'
                anyOf:
                  - type: string
                    maxLength: 256
                    pattern: ^[a-zA-Z0-9_-]+$
                  - type: 'null'
              - type: 'null'
            description: Folder the event is filed under, or `null` if at the root.
          description:
            anyOf:
              - type: string
              - type: 'null'
            description: Human-readable description, or `null` if none set.
          properties:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^[a-zA-Z_][a-zA-Z_0-9]*$
                  description: Property key, e.g. `amount` or `plan`. Must be a bare identifier — it is emitted as a SQL alias when the property is used as a `by()` dimension, and there is no way to quote one in the Analytics Engine dialect.
                type:
                  type: string
                  enum:
                    - string
                    - number
                    - boolean
                  description: Value type of the property as recorded on the event.
                required:
                  default: false
                  description: Whether the property must be present on every emitted event.
                  type: boolean
                description:
                  default: ''
                  description: Human-readable description of the property.
                  type: string
                pending:
                  description: '`true` when this property was DISCOVERED in live traffic rather than declared. Nothing is recorded for it yet — a property is written to Analytics Engine only once it owns a column, and a column is allocated when an admin declares the property (include it in a `PATCH .../events/{id}` body). Approval is a gate rather than a formality: columns are finite and permanently reserved, so auto-allocating them from customer payload keys would exhaust an event''s schema irreversibly.'
                  type: boolean
              required:
                - name
                - type
              additionalProperties: false
              description: One typed property on a catalogued event — declared by an admin, or discovered in traffic and awaiting declaration.
            description: Typed properties declared on the event.
          pending:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
            description: '`1` if this is an auto-discovered name awaiting approval (metrics on it fail until approved), `0` if approved/usable.'
          createdAt:
            type: string
            description: ISO-8601 timestamp of creation.
        required:
          - id
          - name
          - description
          - properties
          - pending
          - createdAt
        additionalProperties: false
        description: A catalogued event.
      description: Every catalogued event in the project (including pending auto-discovered names).
    CreateEventRequest:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-zA-Z0-9_][a-zA-Z0-9_\-.]{0,49}$
          description: Event name. Starts with a letter, digit, or `_`; letters, digits, `_`, `-`, `.`; max 50 characters. The cap is the Analytics Engine index budget — 96 bytes total, less a 36-byte project UUID and a separator — and the API has always enforced 50 while this spec advertised 128. The charset is ASCII, so characters and bytes are the same count. Immutable after create — this is the handle metric queries reference.
        folder:
          $ref: '#/components/schemas/Folder'
        description:
          description: Optional human-readable description of the event.
          type: string
        properties:
          default: []
          description: Typed properties declared on the event. Defaults to an empty list.
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 64
                pattern: ^[a-zA-Z_][a-zA-Z_0-9]*$
                description: Property key, e.g. `amount` or `plan`. Must be a bare identifier — it is emitted as a SQL alias when the property is used as a `by()` dimension, and there is no way to quote one in the Analytics Engine dialect.
              type:
                type: string
                enum:
                  - string
                  - number
                  - boolean
                description: Value type of the property as recorded on the event.
              required:
                default: false
                description: Whether the property must be present on every emitted event.
                type: boolean
              description:
                default: ''
                description: Human-readable description of the property.
                type: string
            required:
              - name
              - type
            additionalProperties: false
            description: One typed property declared on a catalogued event.
      required:
        - name
      additionalProperties: false
      description: Body for `POST /api/admin/events`. Only `name` is required.
    CreateEventResponse:
      type: object
      properties:
        id:
          type: string
          description: Newly assigned event id.
        name:
          type: string
          description: The event name that was registered.
      required:
        - id
        - name
      additionalProperties: false
      description: Result of creating (or approving an existing pending) event.
    GetEventResponse:
      type: object
      properties:
        id:
          type: string
          description: Stable opaque event id.
        name:
          type: string
          description: Event name — the handle metric queries reference.
        folder:
          anyOf:
            - description: 'Optional folder name used to group items in the dashboard. Part of the SDK lookup key: an item in folder `checkout` named `new-cart` is referenced as `checkout/new-cart` from the SDK.'
              anyOf:
                - type: string
                  maxLength: 256
                  pattern: ^[a-zA-Z0-9_-]+$
                - type: 'null'
            - type: 'null'
          description: Folder the event is filed under, or `null` if at the root.
        description:
          anyOf:
            - type: string
            - type: 'null'
          description: Human-readable description, or `null` if none set.
        properties:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 64
                pattern: ^[a-zA-Z_][a-zA-Z_0-9]*$
                description: Property key, e.g. `amount` or `plan`. Must be a bare identifier — it is emitted as a SQL alias when the property is used as a `by()` dimension, and there is no way to quote one in the Analytics Engine dialect.
              type:
                type: string
                enum:
                  - string
                  - number
                  - boolean
                description: Value type of the property as recorded on the event.
              required:
                default: false
                description: Whether the property must be present on every emitted event.
                type: boolean
              description:
                default: ''
                description: Human-readable description of the property.
                type: string
              pending:
                description: '`true` when this property was DISCOVERED in live traffic rather than declared. Nothing is recorded for it yet — a property is written to Analytics Engine only once it owns a column, and a column is allocated when an admin declares the property (include it in a `PATCH .../events/{id}` body). Approval is a gate rather than a formality: columns are finite and permanently reserved, so auto-allocating them from customer payload keys would exhaust an event''s schema irreversibly.'
                type: boolean
            required:
              - name
              - type
            additionalProperties: false
            description: One typed property on a catalogued event — declared by an admin, or discovered in traffic and awaiting declaration.
          description: Typed properties declared on the event.
        pending:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: '`1` if this is an auto-discovered name awaiting approval (metrics on it fail until approved), `0` if approved/usable.'
        createdAt:
          type: string
          description: ISO-8601 timestamp of creation.
      required:
        - id
        - name
        - description
        - properties
        - pending
        - createdAt
      additionalProperties: false
      description: A catalogued event.
    DeleteEventResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required:
        - ok
      additionalProperties: false
      description: Confirmation that the event was archived.
    UpdateEventRequest:
      type: object
