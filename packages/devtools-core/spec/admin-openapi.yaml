        - id
      additionalProperties: false
      description: Result of updating or approving an event.
    ApproveEventRequest:
      type: object
      properties:
        folder:
          $ref: '#/components/schemas/Folder'
        description:
          description: New description for the event.
          type: string
        properties:
          description: Replaces the full property set (no merge). Omit to leave properties unchanged.
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 64
                pattern: ^[a-zA-Z_][a-zA-Z_0-9]*$
                description: Property key, e.g. `amount` or `plan`. Must be a bare identifier — it is emitted as a SQL alias when the property is used as a `by()` dimension, and there is no way to quote one in the Analytics Engine dialect.
              type:
                type: string
                enum:
                  - string
                  - number
                  - boolean
                description: Value type of the property as recorded on the event.
              required:
                default: false
