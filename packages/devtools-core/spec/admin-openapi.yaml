openapi: 3.2.0
info:
  title: Shipeasy Admin API
  version: 2.0.0
  description: |-
    REST API for managing feature gates, experiments, configs, universes, and killswitches in a Shipeasy project. Authenticate with an admin SDK key (`Authorization: Bearer sdk_admin_…`) and scope every request to a project via the `X-Project-Id` header.

    Mint admin keys via `POST /api/admin/keys` with `type: "admin"`. Keys expire after 90 days; rotate with the `revoke` action.
  contact:
    name: Shipeasy
    url: https://shipeasy.ai
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://shipeasy.ai
    description: Production
  - url: http://localhost:3000
    description: Local Next.js dev server
security:
  - bearerSdkKey: []
tags:
  - name: Release
    summary: Feature delivery — flags, kill switches, dynamic configs, A/B experiments, and the universes they bucket in.
    kind: nav
    description: |-
      Release: the feature-delivery surface. One roof over the five resources
      that decide which code path a user gets — feature gates (flags), kill
      switches, dynamic configs, A/B/n experiments, and the universes that bucket
      them — each exposed as its own subcommand group.

      **Groups.**
      - `flags` — boolean feature gates: AND-combined targeting rules + a percentage rollout (basis points), evaluated on the SDK hot path.
      - `killswitch` (`ks`) — per-env boolean overrides for incident response; no rules, no rollout, versioned per environment.
      - `configs` — JSON-Schema-validated structured values with a draft → publish workflow, delivered per environment.
      - `experiments` — randomised A/B/n assignment plus the analysis pipeline (t-test, sequential testing, SRM detection); `universes` hold the shared bucketing space and holdouts the experiments draw from.

      **Delivery model.** Every write rebuilds the project's KV blob and purges
      the CDN — SDKs poll at the plan interval and never touch the database on
      the hot path. The destructive verb is `archive` (soft-delete), never
      `delete`.

      Run `shipeasy release <group> --help` for the full contract of each group.
  - name: Flags
    parent: Release
    description: |-
      Feature gates: boolean flags evaluated at runtime against project rules + a percentage rollout.

      **Identity.** Each gate is keyed by a stable `name` (a-z, 0-9, `_`/`-`, max 64 chars) which is what SDKs pass to `Shipeasy.checkGate(user, '<name>')`. The `name` is immutable — rename means delete + recreate.

      **Evaluation model.** A gate returns `true` when (a) `enabled` is true, and (b) the caller satisfies the gate's rules. There are two evaluation shapes:
      - **Flat** — `rules` (AND-combined predicates) gate the caller, then `rollout_pct` (basis points, 0–10000) hashes them into a bucket. Used for simple `is in X% rollout` gates.
      - **Gatekeeper stack** — an ordered array of `condition` and `rollout` sub-gates, evaluated top-to-bottom; first match wins. Used to express `internal-only ∪ 1% beta ∪ 50% public` in one gate. When `stack` is present it takes precedence over the flat fields.

      **Rules.** Each rule is `{ attr, op, value }`. Supported ops: `eq`, `neq`, `in`, `not_in`, `gt`, `gte`, `lt`, `lte`, `contains`, `regex`. Attribute names match the keys on the SDK evaluation context (e.g. `country`, `plan`, `email`).

      **Rollout basis points.** `rollout_pct` is in **basis points**, not percent. `0` = 0%, `100` = 1%, `5000` = 50%, `10000` = 100%. This allows sub-1% precision (e.g. `7` = 0.07%).

      **Lifecycle.** Create dark (`rollout_pct: 0`) → attach rules → ramp via PATCH → flip kill-switch via `disable`/`enable` → delete once retired. Deletion is blocked while a running experiment references the gate as a targeting gate.
  - name: Killswitch
    parent: Release
    x-cli:
      aliases:
        - ks
    description: |-
      Killswitches: per-env boolean overrides for kill-style operational toggles. Optimised for incident response — no rules, no rollout, just a flat boolean (plus optional per-key overrides) versioned per environment.

      **Identity.** Each killswitch is keyed by `name` in `folder.name` form (e.g. `payments.checkout`). Immutable after create.

      **Per-env values.** Every killswitch stores one version stream per env (`dev`, `stage`, `prod`). A `PATCH` with `value`/`switches` applies to **every** env in one shot (publishes a new version per env). To touch a single env, use `PUT /{id}/switch` and friends.

      **Switches map.** Optional `switches: { key: bool }` overrides the flat `value` for specific named call sites — useful for region/feature-scoped kills.

      **Versioning.** Each publish (create, update, set-switch, unset-switch) bumps the per-env `version` monotonically. SDKs deliver the latest published version.
  - name: Configs
    parent: Release
    description: |-
      Dynamic configs: JSON-Schema-validated structured values delivered to SDKs and editable per environment with a draft/publish workflow.

      **Identity.** Each config is keyed by `name` in `folder.name` form (e.g. `pricing.tiers`). Immutable after create.

      **Schema-first.** Every config carries a JSON Schema (draft 2020-12, top-level `type: 'object'`). Every published value is validated against it.

      **Drafts → publish.** Per-env edits go through `PUT /{id}/drafts` (stages a value) then `POST /{id}/publish` (promotes to a new version). The flat `PATCH /{id}` republishes on **every** env in one shot — bypassing drafts.

      **Versioning.** Each publish bumps the per-env `version` monotonically. SDKs deliver the latest published version for each env.
  - name: Experiments
    parent: Release
    description: |-
      A/B/n experiments: randomised group assignment plus the analysis pipeline (t-test, sequential testing, SRM detection) on top of a universe.

      **Identity.** Stable `name` (a-z, 0-9, `_`/`-`, max 64 chars). Immutable after create.

      **Lifecycle.** `draft → running → stopped → archived`. Transition via `POST /{id}/status`. An archived experiment that never started can be restored with `archived → draft`; restarting an archived experiment directly is not allowed.

      **Allocation.** `allocation_pct` (basis points, 0–10000) is the share of the targeted audience enrolled; `groups[].weight` (must sum to 10000) splits the enrolled audience. `targeting_gate` narrows the eligible audience before allocation.

      **Immutable while running.** `allocation_pct`, `groups`, `salt`, `universe`, `params` cannot be edited on a running experiment — stop it first.

      **Metrics.** Attach via `POST /{id}/metrics`. Each metric has a role: `goal` drives the decision, `guardrail` blocks ship on regression, `secondary` is informational.

      **Analysis.** Daily cron writes results to D1. Read via `GET /{id}/results` (latest per metric/group/day) or `GET /{id}/timeseries` (full history). `POST /{id}/reanalyze` requeues the analysis pass.
  - name: Universes
    parent: Experiments
    description: |-
      Universes: the shared bucketing space all experiments draw from.

      **Identity.** Each universe is keyed by a stable `name` (a-z, 0-9, `_`/`-`, max 64 chars). Experiments reference it via `universe: '<name>'`. The name is immutable.

      **Unit of randomisation.** `unit_type` selects the attribute hashed into a 0–9999 bucket — default `user_id` for per-user randomisation, `account_id` to keep a whole account in the same group.

      **Holdout.** `holdout_range` is an inclusive `[lo, hi]` bucket range (0–9999) reserved for measurement — callers hashed into the holdout are excluded from every experiment in the universe. Pro plan or higher.

      **Deletion.** Blocked while any non-archived experiment references the universe — archive those first.
  - name: Templates
    parent: Flags
    description: |-
      Targeting-rule templates: reusable `{ attr, op, value }` rule definitions
      (country, email-domain, region presets, …). Read-only built-ins ship with
      the platform; each project can also save its own. To target by
      country/plan/region, list templates, copy the matching template's `rules`,
      substitute the concrete value(s), and pass them to `release flags create`.
  - name: Attributes
    parent: Flags
    description: |-
      Targeting attributes: the auto-inferred schema of user-context keys the
      platform has observed in evaluation calls. Read-only — populated by the
      SDK hot path, surfaced here so you can see which keys (and value types)
      are available when writing gate/experiment targeting rules.
  - name: Metrics
    description: |-
      Metrics: the event-backed queries that drive tracking dashboards and
      experiment success / guardrail measurement.

      **Definition.** Each metric pins one source event (`event_name`), one
      aggregation, and (for `sum`/`avg`/quantile) a numeric value label. The
      query is expressed as the DSL string (`query`, e.g. `sum(purchase, amount)`)
      or its typed IR (`query_ir`) — supply exactly one.

      **Identity.** Keyed by a stable `name` (single segment or `folder.name`).
      Resolve endpoints accept the `id` or the `name`.

      **Deletion.** Archive (soft-delete). Blocked while the metric is attached
      to a running experiment — stop those first.
  - name: Events
    parent: Metrics
    description: |-
      Events: the catalog of event names (and their typed properties) that metric queries reference.

      **Auto-discovery.** The SDK's `/collect` ingest path records any unknown event name it receives as a `pending` row (`pending: 1`) so you can review it. Metrics defined on a pending event fail until it is approved.

      **Approval.** `POST /{id}/approve` promotes a pending event to usable (`pending: 0`), optionally declaring its folder/description/properties in the same call. Registering a brand-new event via `POST` that matches a pending name approves it instead of failing with a conflict.

      **Properties.** Each event can declare typed properties (`name`, `type` of `string|number|boolean`, `required`). On update/approve the `properties` array replaces the full set — there is no merge.

      **Deletion.** Soft-delete (the user-facing verb is `archive`). Blocked while any metric still references the event — delete those metrics first.
  - name: Ops
    description: |-
      Operational queue: the unified table of bug reports, feature requests, and
      auto-filed error/alert tickets, all over `/api/admin/ops`. One `create`
      endpoint files either user type (`type: bug | feature_request`); list, get,
      update, and link-pr are unified across every type. Also exposes the
      `notify` escalation bell and the read-only Slack-channels list used to
      resolve alert-rule notification targets.

      **Handles.** A queue item is addressed by its per-project `number` (e.g. `7`)
      or its full id — the API resolves either.
  - name: Alerts
    parent: Ops
    x-cli:
      aliases:
        - ar
    description: |-
      Alert rules: the metric-threshold definitions the analysis cron evaluates each run.

      **What fires.** Each rule binds a `metricId`, a `comparator` (`gt`/`gte`/`lt`/`lte`), and a `threshold`. On every cron pass the cron aggregates the metric over the trailing `windowHours` and raises an alert at `severity` when `value comparator threshold` holds.

      **Immutable metric.** The bound metric (and its aggregation) is fixed at create time — there is no update path for `metricId`. Tune `threshold`/`comparator`/`windowHours`/`severity`/`name`/`enabled` instead, or delete + recreate to repoint the rule at a different metric.

      **Delivery.** `notify` optionally targets a Slack channel and/or email for this rule; `null` falls back to the project's default notification settings. Slack targets require a connected Slack connector.
  - name: Fired Alerts
    parent: Ops
    description: |-
      Fired alerts: the conditions the platform has actually raised — metric-rule
      crossings, armed kill switches, experiment SRM/peek guards, and guardrail
      breaches. Raised only by the platform (UI killswitch handlers plus the
      worker analysis consumer and alerts cron), never filed by hand; deduped per
      `(source, dedupeKey)` with auto-resolve when the condition clears. This
      surface lists them and triages one (status flip + person/agent owner). The
      *rules* that define metric-threshold alerts are the sibling alert-rules
      resource.
  - name: Agents
    parent: Ops
    description: |-
      Connected AI agents — one per authenticated trigger connector (Claude /
      Cursor / Copilot / Jules). The read-only roster behind agent assignment
      and the `ops ack` agent types: an AI ack (`ops ack <handle> --agent
      <type>`) requires the type to appear here, so this list is where an
      `AGENT_NOT_CONNECTED` error sends you.
  - name: Comments
    parent: Ops
    description: |-
      Comments on a queue item — the discussion thread that hangs off any bug,
      feature request, or auto-filed error/alert ticket. Append a comment or read
      the thread; one level of threaded replies via `parentId`.

      **Mentions.** `@teammate` in a body raises an in-app notification for that
      person; `@shipeasy` asks Jarvis (the AI agent) to read the item and reply.
      Comments authored by Jarvis carry `authorType: system`.
  - name: Investigations
    parent: Ops
    description: |-
      Investigation records on a queue item — the structured, read-only write-ups
      an AI agent produces while working it (findings / a blocking question / QA
      notes), plus the `working` run rows an ack or an AI hand-off opens. This is
      the AI-write seam the cockpit's detail panel renders: `list` reads what a
      previous run found, `create` appends a new record, and `update` fills in the
      `working` run record you were handed (findings, PR, confidence) as you work.
  - name: Projects
    description: |-
      Projects: the account-level container every other resource is scoped to.

      **Account-level, not bound-project-level.** Both operations resolve from the caller's credential rather than the `.shipeasy`-bound project — `current` reads the project the auth header maps to, and `upsert` find-or-creates under the session's owner. Neither touches the local `.shipeasy` binding; recording the result there is a consumer side-effect layered on top.

      **Idempotent upsert.** A project is keyed by `(owner_email, domain)`. Calling `upsert` again with the same domain returns the existing project with `created: false`, so it is safe to run on every install.
  - name: i18n
    description: |-
      String Manager (i18n): the worker-safe REST surface — locale profiles, the
      insert-only key push, single-key overwrite, profile publish, and the read-only
      key/draft listings.

      The fs/AST parts (scan, validate, install-loader, codemod) are NOT part of
      this API — they stay in the fs-having CLI/MCP.
  - name: Profiles
    parent: i18n
    description: Locale profiles (e.g. `en:prod`) — create, list, and publish a profile to the CDN.
  - name: Keys
    parent: i18n
    description: Translation keys — the insert-only push, single-key overwrite, and key listing.
  - name: Drafts
    parent: i18n
    description: Machine-translation drafts awaiting review before publish.
  - name: Errors
    description: |-
      Tracked production errors: the deduplicated, fingerprinted error stream the
      SDK + framework error sinks feed. Read-only list/get plus a status update
      (`open`/`resolved`/`ignored`), an auto-file-to-GitHub-issue action, and a
      time-series rollup. Errors are ingestion-only — there is no create route.
  - name: Trigger
    parent: Ops
    description: |-
      Recurring coding-agent triggers: the scheduled, unattended runs that burn
      down the ops queue in `--pr` mode (one PR per fixed item; nothing
      auto-merges). Shipeasy can fire four providers directly — Claude routines,
      Cursor cloud agents, Copilot cloud agents, and Google Jules (the Gemini
      path) — registered here as trigger connectors (idempotent per provider
      key). Other platforms (Codex, Windsurf, Cline, OpenClaw, OpenCode,
      Continue) schedule on their own surface — typically a GitHub Actions
      `schedule:` cron running the platform's headless CLI with the shared
      trigger prompt.
  - name: Connectors
    description: |-
      Outbound integrations: the per-project destinations feedback + trigger
      events are dispatched to (GitHub, Google Sheets, Slack, and the
      Claude/Cursor/Copilot/Jules autopilot triggers). CRUD plus a manual
      `fire` (trigger-only) and a `test` payload.
  - name: API Keys
    description: |-
      Admin + SDK key management: mint, list, and revoke the `sdk_*` keys that
      authenticate every other endpoint. The plaintext key is returned exactly
      once, on create. Revoke is the rotation verb.
paths:
  /api/admin/gates:
    get:
      operationId: listGates
      summary: List feature gates
      description: |-
        Returns a single page of gates ordered by `updated_at desc, id desc`. Use the `cursor` query parameter to paginate.

        **Use case:** Snapshot every gate in the project — for example to render an admin overview or to drive a CI check that asserts no gate is left at 100% in staging.
      tags:
        - Flags
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PaginationLimit'
        - $ref: '#/components/parameters/PaginationCursor'
        - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: List feature gates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGatesResponse'
              example:
                data:
                  - id: gat_01j7w7m9q4hxbf6npe6s9zr3vc
                    name: checkout_v2
                    enabled: 1
                    rolloutPct: 5000
                    rules:
                      - attr: country
                        op: in
                        value:
                          - US
                          - CA
                          - GB
                      - attr: plan
                        op: neq
                        value: free
                    salt: 9c1f4f1f2c0c4a5fa1c2b6d3e7c8e3a1
                    title: Checkout v2
                    description: New checkout flow. Pro users in US/CA/GB only.
                    folder: checkout
                    groupName: growth
                    ownerEmail: ana@example.com
                    stack: null
                    creatorEmail: ana@example.com
                    updaterEmail: bo@example.com
                    version: 4
                    createdAt: '2026-05-01T10:12:00.000Z'
                    updatedAt: '2026-05-09T16:01:22.000Z'
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-error-codes:
        - BAD_REQUEST
        - UNAUTHORIZED
        - FORBIDDEN
      x-cli:
        name: list
    post:
      operationId: createGate
      summary: Create a feature gate
      description: |-
        Creates a new gate. Default `enabled: true` at the supplied `rollout_pct` (`0` = fully dark).

        Only `name` is required. Request fields use snake_case (`owner_email`); the GET response returns camelCase (`ownerEmail`, `groupName`).

        Returns `409` if `name` already exists in the project (case-sensitive).

        **Use cases**

        - **Dark create + ramp later** — `{ "name": "checkout_v2" }` at 0% rollout. Ramp via PATCH after deploy validation.
        - **Targeted rollout** — supply `rules` to gate the caller (e.g. only `plan = pro` users) plus a `rollout_pct` to bucket within that audience.
        - **Gatekeeper stack** — supply `stack` instead of `rules`/`rollout_pct` for `internal ∪ beta ∪ public` fall-through. Stack entries evaluated top-to-bottom; first match wins.
        - **Dashboard metadata** — populate `title`, `description`, `folder`, `group`, `owner_email` so the admin UI is self-documenting from day one.
        - **Disabled on create** — pre-provision with `enabled: false` for a future launch; flip on with `POST /{id}/enable` at go-live.
      tags:
        - Flags
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGateRequest'
            examples:
              minimal:
                summary: Minimal — dark gate, name only
                description: 'Smallest valid body. The gate is created `enabled: true` at `rollout_pct: 0`, with no rules. Ramp it later via PATCH.'
                value:
                  name: checkout_v2
              targeted:
                summary: Targeted rollout — rules + percentage
                description: 'Gate Pro users in US/CA/GB, then hash 10% of that audience into the on-bucket (`rollout_pct: 1000` = 10.00%). Adds dashboard metadata so the gate is self-documenting.'
                value:
                  name: checkout_v2
                  rollout_pct: 1000
                  rules:
                    - attr: country
                      op: in
                      value:
                        - US
                        - CA
                        - GB
                    - attr: plan
                      op: neq
                      value: free
                  title: Checkout v2
                  description: New checkout flow. Pro users in US/CA/GB only.
                  folder: checkout
                  group: growth
                  owner_email: ana@example.com
              gatekeeperStack:
                summary: Gatekeeper stack — internal ∪ beta ∪ public
                description: 'Three-layer fall-through: employees always on, opted-in beta accounts always on, then 25% of everyone else. First match wins; evaluation stops as soon as one entry returns `true`.'
                value:
                  name: checkout_v2
                  title: Checkout v2
                  owner_email: ana@example.com
                  stack:
                    - id: 01HKJ0EMP
                      type: condition
                      name: Employees
                      pass: any
                      rules:
                        - attr: email
                          op: regex
                          value: '@acme\.com$'
                    - id: 01HKJ0BETA
                      type: condition
                      name: Beta opt-in
                      pass: all
                      rules:
                        - attr: beta_opt_in
                          op: eq
                          value: true
                    - id: 01HKJ0PUB
                      type: rollout
                      name: Public
                      rolloutPct: 2500
                      bucketBy: userID
                      locked: true
              disabledOnCreate:
                summary: Disabled on create — provision then enable later
                description: 'Create with `enabled: false` so the gate evaluates to `false` for every caller until a follow-up `POST /{id}/enable`. Useful when provisioning ahead of a launch.'
                value:
                  name: checkout_v2
                  enabled: false
                  rollout_pct: 0
      responses:
        '201':
          description: Create a feature gate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGateResponse'
              example:
                id: gat_01j7w7m9q4hxbf6npe6s9zr3vc
                name: checkout_v2
          links:
            UpdateGate:
              operationId: updateGate
              parameters:
                id: $response.body#/id
            EnableGate:
              operationId: enableGate
              parameters:
                id: $response.body#/id
            DisableGate:
              operationId: disableGate
              parameters:
                id: $response.body#/id
            DeleteGate:
              operationId: deleteGate
              parameters:
                id: $response.body#/id
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-error-codes:
        - BAD_REQUEST
        - UNAUTHORIZED
        - FORBIDDEN
        - ALREADY_EXISTS
        - VALIDATION
        - PLAN_LIMIT
      x-cli:
        name: create
        positional:
          - name
  /api/admin/gates/{id}:
    get:
      operationId: getGate
      summary: Get one gate
      description: |-
        Returns the full gate row — including the gatekeeper `stack`, resolved creator/last-editor emails, and the edit `version` — for one gate, addressed by id or `name`.

        **Use case:** Inspect a single gate's current rollout, rules, and stack before editing it, without paging through the whole list.
      tags:
        - Flags
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: id
          in: path
          required: true
          description: Stable opaque gate id (`gat_…`) or the gate's `name`.
          schema:
            $ref: '#/components/schemas/ResourceId'
      responses:
        '200':
          description: Get one gate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateApiRow'
              example:
                id: gat_01j7w7m9q4hxbf6npe6s9zr3vc
                name: checkout_v2
                enabled: 1
                type: targeting
                rolloutPct: 5000
                rules:
                  - attr: country
                    op: in
                    value:
                      - US
                      - CA
                      - GB
                salt: 9c1f4f1f2c0c4a5fa1c2b6d3e7c8e3a1
                title: Checkout v2
                description: New checkout flow. Pro users in US/CA/GB only.
                folder: checkout
                groupName: growth
                ownerEmail: ana@example.com
                stack: null
                creatorEmail: ana@example.com
                updaterEmail: bo@example.com
                version: 4
                createdAt: '2026-05-01T10:12:00.000Z'
                updatedAt: '2026-05-09T16:01:22.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-error-codes:
        - BAD_REQUEST
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
      x-cli:
        name: get
        positional:
          - id
    patch:
      operationId: updateGate
      summary: Update a feature gate
      description: |-
        Partial update — only supplied fields change. Array fields (`rules`, `stack`) **replace** wholesale; there is no merge or append.

        `name` and the gate id are immutable. The response carries only `{ id }` — re-fetch via `GET /api/admin/gates` for the new row.

        **Use cases**

        - **Ramp rollout** — `{ "rollout_pct": 5000 }` for 50%. Basis points (0–10000); `100` = 1%.
        - **Kill switch** — `{ "enabled": false }`. Forces evaluation to `false` for every caller regardless of rules/rollout. Re-enable with `POST /{id}/enable` or `{ "enabled": true }`.
        - **Modify a rule's `in` set** — send the full new `rules` array. To add `'GB'` to `['US','CA']`: `{ "rules": [{ "attr": "country", "op": "in", "value": ["US","CA","GB"] }] }`. No per-rule patch endpoint.
        - **Add targeting from scratch** — `{ "rules": [{ "attr": "email", "op": "regex", "value": "@acme\\.com$" }] }`.
        - **Switch to gatekeeper stack** — send a non-null `stack`. To revert to flat eval, send `{ "stack": null }`.
        - **Update metadata** — any subset of `title`, `description`, `folder`, `group`, `owner_email`.
      tags:
        - Flags
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: id
          in: path
          required: true
          description: Stable opaque gate id (`gat_…`) or the gate's `name`.
          schema:
            $ref: '#/components/schemas/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGateRequest'
            examples:
              rampRollout:
                summary: Ramp rollout — 0 → 50%
                description: Single-field patch. `5000` basis points = 50%.
                value:
                  rollout_pct: 5000
              killSwitch:
                summary: Kill switch — disable the gate
                description: Forces evaluation to `false` for every caller, regardless of rules or rollout. Same effect as `POST /{id}/disable` but composable with other patches.
                value:
                  enabled: false
              extendInRule:
                summary: Add a value to an `in` rule
                description: Array fields replace wholesale — there is no per-rule patch. To add `'AU'` to a country whitelist that previously held `['US','CA','GB']`, send the full new `rules` array. Same pattern applies to `not_in`.
                value:
                  rules:
                    - attr: country
                      op: in
                      value:
                        - US
                        - CA
                        - GB
                        - AU
                    - attr: plan
                      op: neq
                      value: free
              replaceStack:
                summary: Replace gatekeeper stack
                description: 'Stack is replace-wholesale. Send the full new ordered list. Pass `"stack": null` to revert the gate to flat `rules` + `rollout_pct` evaluation.'
                value:
                  stack:
                    - id: 01HKJ0EMP
                      type: condition
                      name: Employees
                      pass: any
                      rules:
                        - attr: email
                          op: regex
                          value: '@acme\.com$'
                    - id: 01HKJ0PUB
                      type: rollout
                      name: Public
                      rolloutPct: 5000
                      locked: true
              updateMetadata:
                summary: Update dashboard metadata
                description: Any subset of `title`, `description`, `folder`, `group`, `owner_email`. Snake-case in the request; the GET response returns camelCase (`groupName`, `ownerEmail`).
                value:
                  title: Checkout v2 (50%)
                  description: Bumped to 50% after passing canary. Added AU.
                  folder: checkout
                  owner_email: ana@example.com
      responses:
        '200':
          description: Update a feature gate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateGateResponse'
              example:
                id: gat_01j7w7m9q4hxbf6npe6s9zr3vc
        '400':
          $ref: '#/components/responses/BadRequest'
