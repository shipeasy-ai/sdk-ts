  /api/admin/metrics/{id}/series:
    post:
      operationId: getMetricSeries
      summary: Get a metric's time series
      description: |-
        Compiles the metric's typed IR into Analytics Engine SQL and returns the bucketed series over the requested window (near-real-time; ingest lag is seconds). The window bounds are epoch **seconds**; `to` must be strictly greater than `from`. The response echoes the SQL that produced the rows.

        Returns `422` when the stored definition can't compile (e.g. a label or event has gone away — re-save the metric), and `502`/`503` when the analytics upstream fails or isn't configured.

        **Use case:** Render the metric trend chart / sparkline, or pull raw bucketed values to feed an external dashboard.
      tags:
        - Metrics
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: id
          in: path
          required: true
          description: Stable opaque metric id (`met_…`).
          schema:
            $ref: '#/components/schemas/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetMetricSeriesRequest'
            examples:
              lastDayHourly:
                summary: Last 24h, hourly buckets
                description: Hourly metric values over a one-day window (bounds in epoch seconds).
                value:
                  from: 1751000400
                  to: 1751086800
                  bucket: 3600
      responses:
        '200':
          description: Get a metric's time series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMetricSeriesResponse'
              example:
                sql: |-
                  SELECT intDiv(toUInt32(double2), 3600) * 3600 AS t,
                    sum(_sample_interval) AS v
                  FROM shipeasy_metric_events
                  WHERE index1 = 'e976b15e-2f0d-4c6e-9b1a-3a7c1f2d8e90'
                    AND blob1 = 'checkout_completed'
                    AND double2 >= 1751000400 AND double2 < 1751086800
                  GROUP BY t
                  ORDER BY t
                rows:
                  - t: 1751000400
                    v: 412
                  - t: 1751004000
                    v: 531
                  - t: 1751007600
                    v: 468
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      x-error-codes:
        - BAD_REQUEST
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION
