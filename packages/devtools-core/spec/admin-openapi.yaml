        - profile_id
        - keys
      additionalProperties: false
      description: 'Body for `PUT /api/admin/i18n/keys`. Bulk upsert (overwrite): existing keys are replaced, new ones inserted. Backs the devtools overlay''s in-product label editing; deliberately not surfaced by the CLI or MCP.'
    UpsertI18nKeysResponse:
      type: object
      properties:
        upserted:
          type: number
          description: Number of keys written (inserted or overwritten).
      required:
        - upserted
      additionalProperties: false
      description: Result of a bulk key upsert. The affected profile's KV snapshot is rebuilt (and the CDN purged) before this returns.
    PushI18nKeysRequest:
      type: object
      properties:
        profile_id:
          type: string
          format: uuid
          description: Target profile id to add keys to.
        keys:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: object
            properties:
              key:
                type: string
                minLength: 1
                maxLength: 256
                description: Dotted key path, e.g. `home.cta`.
              value:
                type: string
                description: Translated value for the key.
              description:
                type: string
                description: Optional human note stored with the key.
              variables:
                type: array
                maxItems: 32
                items:
                  type: string
                  minLength: 1
                  maxLength: 64
                description: Optional explicit list of `{{var}}` placeholder names in the value. Auto-derived from the value when omitted.
            required:
              - key
              - value
            additionalProperties: false
          description: Keys to add. Insert-only by default — existing keys are reported back as `skipped` (set `force` to overwrite them instead).
        force:
          type: boolean
          default: false
          description: Overwrite keys that already exist with the submitted value instead of skipping them. Overwritten keys come back as `updated`. Off by default so a routine push can never clobber live translations.
      required:
        - profile_id
        - keys
      additionalProperties: false
      description: 'Body for `POST /api/admin/i18n/keys`. Insert-only by default: keys that already exist are never overwritten — pass `force: true` to overwrite them in bulk, or use `PUT /keys/{id}` to change one value.'
    PushI18nKeysResponse:
      type: object
      properties:
        added:
          type: array
          items:
            type: string
          description: Key names that were newly inserted.
        skipped:
          type: array
          items:
            type: string
          description: Key names that already existed and were left untouched. Always empty when `force` was set — those key names come back under `updated` instead.
        updated:
          type: array
          items:
            type: string
          description: Key names that already existed and were overwritten with the submitted value. Only ever non-empty when the push set `force`.
        pushed_count:
          type: number
          description: Number of keys inserted (== `added.length`).
        skipped_count:
          type: number
          description: Number of keys skipped (== `skipped.length`).
        updated_count:
          type: number
          description: Number of existing keys overwritten (== `updated.length`).
      required:
        - added
        - skipped
        - updated
        - pushed_count
        - skipped_count
        - updated_count
      additionalProperties: false
      description: Result of a key push — what was inserted, what was left alone, and (with `force`) what was overwritten.
    UpdateI18nKeyRequest:
      type: object
      properties:
        value:
