      additionalProperties: false
      description: Body for `PATCH /api/admin/i18n/drafts/{draftId}`. Transitions the draft's lifecycle state.
    ListI18nDraftKeysResponse:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            description: Stable opaque draft-key id.
          draftId:
            type: string
            description: Id of the draft the key belongs to.
          key:
            type: string
            description: Dotted key path, e.g. `home.cta`.
          value:
            type: string
            description: Staged translated value for the key.
          description:
            description: Optional human note stored with the key, or `null`.
            anyOf:
              - type: string
              - type: 'null'
          variables:
            description: '`{{var}}` placeholder names in the value, or `null` when there are none.'
            anyOf:
              - type: array
                items:
                  type: string
              - type: 'null'
          updatedBy:
            type: string
            description: Actor email that last edited the staged key.
          updatedAt:
            type: string
            description: ISO-8601 timestamp of the last edit.
        required:
          - id
          - draftId
          - key
          - value
          - description
          - variables
          - updatedBy
          - updatedAt
        additionalProperties: false
        description: One staged draft key.
      description: Bare array of the draft's staged keys (no pagination envelope).
    UpsertI18nDraftKeyRequest:
      type: object
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 256
          description: Dotted key path to stage, e.g. `home.cta`.
        value:
          type: string
          description: Staged translated value for the key.
        description:
          type: string
          description: Optional human note stored with the staged key.
      required:
        - key
        - value
      additionalProperties: false
      description: Body for `POST /api/admin/i18n/drafts/{draftId}/keys`. Upserts one staged key into an open draft — inserted when new, overwritten when it already exists. `{{var}}` placeholder names are auto-derived from the value.
    PublishI18nProfileRequest:
      type: object
      properties: {}
      additionalProperties: false
      description: Body for `POST /api/admin/i18n/profiles/{profileId}/publish`. Publishing is profile-wide — the whole profile is snapshotted into one KV blob — so the body takes no options.
    PublishI18nProfileResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
          description: Always `true` on success.
        profile_id:
          type: string
          description: Profile that was published.
        published_at:
          type: string
          description: ISO-8601 timestamp of the publish.
        version:
          type: string
          description: New KV snapshot version that was shipped.
        key_count:
          type: number
          description: Number of keys in the published snapshot.
        changed:
          type: boolean
          description: Whether the snapshot's contents actually changed since the last publish.
        purged:
          type: string
          enum:
            - purged
            - skipped
            - failed
          description: 'CDN purge outcome: `purged` ok, `skipped` (no creds), or `failed` (edge still stale).'
        kv_verified:
          type: boolean
          description: Whether a KV read-back confirmed the new version persisted.
        warning:
          description: Human-readable caveat when the publish landed but is not fully live.
          type: string
      required:
        - ok
        - profile_id
        - published_at
        - version
        - key_count
        - changed
        - purged
        - kv_verified
      additionalProperties: false
      description: Result of a profile-wide publish.
    SetI18nLabelRequest:
      type: object
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 256
          description: Dotted key path to set, e.g. `home.cta`.
        value:
          type: string
          description: New value for the key. Inserted when the key is new, overwritten when it exists.
        profile:
          description: Profile name to target, e.g. `en:prod`. Omit to target the project's default-marked profile.
          type: string
          minLength: 1
          maxLength: 64
        description:
          description: Optional human note to store with the key.
          type: string
      required:
        - key
        - value
      additionalProperties: false
      description: Body for `POST /api/admin/i18n/set`. Upserts one key's value and publishes the profile live.
    SetI18nLabelResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
          description: Always `true` on success.
        profile:
          type: string
          description: Name of the profile that was published.
        profile_id:
          type: string
          description: Id of the profile that was published.
        key:
          type: string
          description: The key that was set.
        value:
          type: string
          description: The value that was stored.
        published_at:
          type: string
          description: ISO-8601 timestamp of the publish.
        version:
          type: string
          description: New KV snapshot version that was shipped.
        key_count:
          type: number
          description: Number of keys in the published snapshot.
        changed:
          type: boolean
          description: Whether the snapshot's contents actually changed since the last publish.
        purged:
          type: string
          enum:
            - purged
            - skipped
            - failed
          description: 'CDN purge outcome: `purged` ok, `skipped` (no creds), or `failed` (edge still stale).'
        kv_verified:
          type: boolean
          description: Whether a KV read-back confirmed the new version persisted.
        warning:
          description: Human-readable caveat when the publish landed but is not fully live.
          type: string
      required:
        - ok
        - profile
        - profile_id
        - key
        - value
        - published_at
        - version
        - key_count
        - changed
        - purged
        - kv_verified
      additionalProperties: false
      description: Result of a one-shot set-and-publish.
    ErrorOccurrence:
      type: object
      description: One sampled instance behind a tracked error — the minimal per-occurrence payload (what varies between instances; everything else lives on the parent `ErrorRecord`). Every column is always present on the wire; nullable columns are `null`, never absent.
      properties:
        id:
          type: string
          description: Stable opaque occurrence id.
        projectId:
          type: string
          description: Project this occurrence belongs to. Always echoes the parent error's `projectId` — redundant on this nested read (a projection candidate), kept because the raw row is returned as-is today.
        errorId:
          type: string
          description: Id of the parent tracked error (`err_…`). Always echoes the enclosing `ErrorRecord.id` — redundant on this nested read (a projection candidate), kept because the raw row is returned as-is today.
        message:
          type: string
          description: This instance's raw message (unlike the fingerprint, never normalized).
        stack:
          description: This instance's stack trace, or `null` if none was captured.
          anyOf:
            - type: string
            - type: 'null'
        url:
          description: This instance's raw URL (ids intact), or `null`.
          anyOf:
            - type: string
            - type: 'null'
        env:
          description: Published env this instance ran against, or `null`.
          anyOf:
            - type: string
            - type: 'null'
        side:
          description: Which SDK side reported it — `client` or `server`. `null` if unknown.
          anyOf:
            - type: string
            - type: 'null'
        sdkVersion:
          description: '`@shipeasy/sdk` version of this instance, or `null`.'
          anyOf:
            - type: string
            - type: 'null'
        extrasJson:
          description: This instance's sanitized extras, JSON-encoded. `null` if none.
          anyOf:
            - type: string
            - type: 'null'
        sampleRate:
          type: integer
          minimum: 1
          description: 1-in-N sampling rate in force when this instance was kept (`1` = the issue was still being recorded exhaustively).
        seenAt:
          type: string
          description: ISO-8601 timestamp this instance was ingested.
      required:
        - id
        - projectId
        - errorId
        - message
        - stack
        - url
        - env
        - side
        - sdkVersion
        - extrasJson
        - sampleRate
        - seenAt
      additionalProperties: false
    ErrorRecord:
      type: object
      description: |-
        A tracked production error — one row per distinct issue, keyed by `fingerprint`. Rows are never created by hand: an ingestion path (worker log drain / the `see()` SDK reporter) folds each occurrence into the matching row, bumping `count` and `lastSeenAt`. The admin surface only lists them, reads one, and flips `status`.

        Field names are camelCase (the D1 row projected through Drizzle). Every row column is always present on the wire; many are *nullable* because the reporting source may not supply them — `null`, never absent. Only `occurrences` is conditional (detail reads only).
      properties:
        id:
          type: string
          description: Stable opaque error id.
        projectId:
          type: string
          description: Project this issue belongs to.
        fingerprint:
          type: string
          description: Stable dedupe key — the issue TITLE (hash of `errorType` + `subject` + `outcome`, plus the violation name for violations). Unique per project — every occurrence with the same title folds into this one row; per-instance variety (message/stack/extras) lives in `occurrences`.
        causedByFingerprint:
          description: Fingerprint of the issue this one descends from — set when `see()` reported the same error (re-throw) or its `{ cause }` (wrap) at an inner boundary first. Points at another error's `fingerprint` in the same project (soft reference, no FK). `null` for a root issue.
          anyOf:
            - type: string
            - type: 'null'
        message:
          type: string
          description: Error message text.
        errorType:
          description: Error class/name, e.g. `TypeError`. `null` when the source didn't supply one.
          anyOf:
            - type: string
            - type: 'null'
        stack:
          description: Stack trace of the latest occurrence, or `null` if none was captured.
          anyOf:
            - type: string
            - type: 'null'
        source:
          description: Where it surfaced — Worker name (`shipeasy`, `shipeasy-worker`) or `sdk-client` / `sdk-server`. `null` if unknown.
          anyOf:
            - type: string
            - type: 'null'
        url:
          description: Latest occurrence's raw URL (with ids intact), or `null`.
          anyOf:
            - type: string
            - type: 'null'
        seenUrls:
          description: Distinct, id-normalized route templates this issue has surfaced on, as a JSON-encoded string array (e.g. `["https://app/dashboard/#/gates"]`). UUIDs / numeric ids / opaque tokens are collapsed to `#` so the same route under different ids counts once. `null` if none recorded.
          anyOf:
            - type: string
            - type: 'null'
        subject:
          description: Consequence subject — `<errorType> causes the <subject> to <outcome>`. `null` if no consequence was reported.
          anyOf:
            - type: string
            - type: 'null'
        outcome:
          description: Consequence outcome — see `subject`. `null` if no consequence was reported.
          anyOf:
            - type: string
            - type: 'null'
        side:
          description: Which SDK side reported it — `client` or `server`. `null` if unknown.
          anyOf:
            - type: string
            - type: 'null'
        env:
          description: Published env the reporting SDK ran against (e.g. `dev`, `staging`, `prod`). `null` if unknown.
          anyOf:
            - type: string
            - type: 'null'
        kind:
          description: '`see()` error kind. `null` when the source didn''t classify the occurrence.'
          anyOf:
            - type: string
              enum:
                - caught
                - uncaught
                - unhandled_rejection
                - network
                - violation
            - type: 'null'
        lastExtrasJson:
          description: Latest occurrence's sanitized extras, JSON-encoded. `null` if none.
          anyOf:
            - type: string
            - type: 'null'
        sdkVersion:
          description: '`@shipeasy/sdk` version of the latest occurrence, or `null`.'
          anyOf:
            - type: string
            - type: 'null'
        count:
          type: integer
          minimum: 1
          description: EXACT number of folded occurrences for this fingerprint — every occurrence increments it, regardless of detail-row sampling.
        occurrences:
          type: array
          description: Sampled per-instance detail rows behind this issue, newest first. Returned only by `GET /api/admin/errors/{id}` (never in list responses). The parent row's `count` / `firstSeenAt` / `lastSeenAt` are exact; these rows are a *sampled sketch* of the instances — exhaustive while the issue is small, thinning to roughly 1-in-10 past 10 occurrences, 1-in-100 past 100, and 1-in-1000 past 1000 (each row's `sampleRate` records the rate in force when it was kept), capped at the newest 100 rows.
          items:
            $ref: '#/components/schemas/ErrorOccurrence'
        status:
          type: string
          enum:
            - open
            - resolved
            - ignored
          description: Triage state. `open` is the default; a `resolved` error reopens automatically (ingestion-side) if it recurs; `ignored` is sticky until flipped back here.
        firstSeenAt:
          type: string
          description: ISO-8601 timestamp of the first folded occurrence.
        lastSeenAt:
          type: string
          description: ISO-8601 timestamp of the most recent folded occurrence. Rows are ordered by this, descending.
        createdAt:
          type: string
          description: ISO-8601 timestamp the row was created.
        updatedAt:
          type: string
          description: ISO-8601 timestamp of the last mutation (e.g. a status flip).
        assigneeId:
          description: PERSON owner of the triage — a `users.id` (soft reference, same value space as a feedback item's `assigneeId`), or `null` if unassigned. Set from the ops cockpit's Owner column; independent of the agent half.
          anyOf:
            - type: string
            - type: 'null'
        assigneeConnectorId:
          description: AGENT owner — the id of a connected trigger connector (`connectors.id`), or `null`. Mutually exclusive with `assigneeAgent`.
          anyOf:
            - type: string
            - type: 'null'
        assigneeAgent:
          description: AGENT owner — a built-in hosted Shipeasy agent (`"jarvis"`, Enterprise-gated), or `null`. Mutually exclusive with `assigneeConnectorId`.
          anyOf:
            - type: string
            - type: 'null'
      required:
        - id
        - projectId
        - fingerprint
        - causedByFingerprint
        - message
        - errorType
        - stack
        - source
        - url
        - seenUrls
        - subject
        - outcome
        - side
        - env
        - kind
        - lastExtrasJson
        - sdkVersion
        - count
        - status
        - firstSeenAt
        - lastSeenAt
        - createdAt
        - updatedAt
        - assigneeId
        - assigneeConnectorId
        - assigneeAgent
      additionalProperties: false
    ListErrorsResponse:
      type: array
      description: A bare JSON array of tracked errors, ordered by `lastSeenAt` descending. There is no pagination envelope — `limit` caps the page size. List rows never include `occurrences` — read one error to get them.
      items:
        $ref: '#/components/schemas/ErrorRecord'
    UpdateErrorStatusRequest:
      type: object
      description: Body for `PATCH /api/admin/errors/{id}`. The only mutable field is `status` (open ⇄ resolved ⇄ ignored).
      properties:
        status:
          type: string
          enum:
            - open
            - resolved
            - ignored
          description: New triage state. `resolved` reopens automatically on recurrence; `ignored` is sticky.
      required:
        - status
      additionalProperties: false
    FileErrorTicketResponse:
      type: object
      description: The feedback ticket that tracks this error. Idempotent — if an open `error` ticket already tracks this fingerprint (hand- or auto-filed), the existing one is returned instead of creating a duplicate.
      properties:
        id:
          type: string
          description: Feedback ticket id.
        number:
          description: Human-facing per-project ticket number. `null` only on the idempotent dedupe path when the pre-existing ticket is a legacy row created before per-project numbering.
          anyOf:
            - type: integer
            - type: 'null'
      required:
        - id
        - number
      additionalProperties: false
    ErrorSeriesRequest:
      type: object
      description: Time window for the occurrence series. Bounds are epoch **seconds** (Analytics Engine stores the occurrence timestamp in seconds). `to` must be strictly greater than `from`.
      properties:
        from:
          type: integer
          minimum: 0
          description: Window start, epoch seconds (inclusive).
        to:
          type: integer
          minimum: 0
          description: Window end, epoch seconds (exclusive). Must be greater than `from`.
        bucket:
          type: integer
          minimum: 60
          maximum: 86400
          default: 3600
          description: Bucket width in seconds (60s–86400s/1d). Defaults to `3600` (hourly). Each returned point is floor-aligned to this width.
      required:
        - from
        - to
      additionalProperties: false
    ErrorSeriesResponse:
      type: object
      description: Bucketed occurrence counts for one tracked error (by its fingerprint), plus the Analytics Engine SQL that produced them.
      properties:
        sql:
          type: string
          description: The Analytics Engine SQL executed to produce `rows` (echoed for transparency / debugging).
        rows:
          type: array
          description: Bucketed occurrence series, ordered by `t` ascending.
          items:
            type: object
            properties:
              t:
                type: integer
                description: Bucket start, epoch seconds, floor-aligned to `bucket`.
              v:
                type: number
                description: Occurrence count in the bucket (sample-interval weighted).
            required:
              - t
              - v
            additionalProperties: true
      required:
        - sql
        - rows
      additionalProperties: false
    ConnectorProvider:
      type: string
      enum:
        - google_sheets
        - github
        - slack
        - claude_trigger
        - cursor_trigger
        - copilot_trigger
        - jules_trigger
      description: Connector destination. OAuth/app providers (`google_sheets`, `github`, `slack`) dispatch the event payload to an external destination. Trigger providers (`claude_trigger`, `cursor_trigger`, `copilot_trigger`, `jules_trigger`) instead kick a coding-agent run that burns down the operational queue.
    ConnectorEvent:
      type: string
      enum:
        - bug.created
        - feature_request.created
      description: Lifecycle event a connector subscribes to. `bug.created` fires when a new bug report lands in the feedback inbox; `feature_request.created` fires for a new feature request. A connector dispatches (posts to Slack / appends a Sheets row / files a GitHub Issue) — or, for trigger connectors, auto-fires a coding-agent run — once per subscribed event.
    ConnectorRecord:
      type: object
      properties:
        id:
          type: string
          description: Stable opaque connector id (a UUID).
        projectId:
          type: string
          description: Id of the project the connector belongs to.
        provider:
          $ref: '#/components/schemas/ConnectorProvider'
        name:
          type: string
          maxLength: 80
          description: Human-readable connector label shown in the dashboard.
        enabled:
          type: boolean
          description: Whether the connector is active. OAuth providers are created `false` and flip to `true` only after the OAuth/config flow completes; trigger providers default to `true` on create. A disabled connector never dispatches and never auto-fires.
        events:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorEvent'
          description: Events this connector is subscribed to. Empty array = no auto-dispatch / no auto-fire (the connector can still be fired/tested manually).
        config:
          type: object
          additionalProperties: true
          description: Provider-specific, non-secret configuration (e.g. a Google Sheets `spreadsheetId`/`sheetTitle`, a Slack channel ref, or a trigger's repo coordinates + routine id). Secrets are never stored here — they live in an encrypted credentials cipher that is never returned by the API.
        accountLabel:
          anyOf:
            - type: string
            - type: 'null'
          description: Display label for the connected account / target (e.g. the OAuth account email, or a trigger's idempotency key such as its repo url or routine id). `null` until the connector is authenticated/configured.
        hasCredentials:
          type: boolean
          description: Whether an encrypted credentials cipher is stored for this connector (`true` once OAuth/token setup completed). The cipher itself is never serialised — this boolean is the only signal. `false` for a fresh OAuth stub or a tokenless trigger.
        lastError:
          anyOf:
            - type: string
            - type: 'null'
          description: Error message from the most recent failed dispatch/fire attempt, or `null` if the last attempt succeeded (or none has run).
        lastAttemptAt:
          anyOf:
            - type: string
            - type: 'null'
          description: ISO-8601 timestamp of the most recent dispatch/fire attempt, or `null` if none has run.
        lastSuccessAt:
          anyOf:
            - type: string
            - type: 'null'
          description: ISO-8601 timestamp of the most recent successful dispatch/fire, or `null` if none has succeeded. Preserved across later failures.
        createdAt:
          type: string
          description: ISO-8601 timestamp of creation.
        updatedAt:
          type: string
          description: ISO-8601 timestamp of last mutation.
      required:
        - id
        - projectId
        - provider
        - name
        - enabled
        - events
        - config
        - accountLabel
        - hasCredentials
        - lastError
        - lastAttemptAt
        - lastSuccessAt
        - createdAt
        - updatedAt
      additionalProperties: false
      description: A connector row. The encrypted credentials cipher backing the connector is intentionally never serialised — `hasCredentials` reports only whether one is stored.
    ListConnectorsResponse:
      type: array
      items:
        $ref: '#/components/schemas/ConnectorRecord'
      description: Bare array of every connector in the project (no pagination envelope).
    CreateOAuthConnectorRequest:
      type: object
      properties:
        provider:
          type: string
          enum:
            - google_sheets
            - github
            - slack
          description: OAuth/app connector destination.
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Human-readable connector label.
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ConnectorEvent'
          description: Events to subscribe to. At least one is required.
      required:
        - provider
        - name
        - events
      additionalProperties: false
      description: 'Create an OAuth/app connector stub. The connector is created `enabled: false` with empty `config` and no credentials; the provider''s OAuth flow then attaches credentials and enables it.'
    ClaudeTriggerConfig:
      type: object
      properties:
        routineId:
          type: string
          minLength: 1
          description: The Claude Code routine id this connector fires (the id recorded at setup). Idempotency key for the connector.
        fireText:
          type: string
          minLength: 1
          description: Optional default prompt sent on a manual fire / when no event text applies.
      required:
        - routineId
      additionalProperties: false
      description: Non-secret config for a Claude trigger.
    CreateClaudeTriggerRequest:
      type: object
      properties:
        provider:
          type: string
          enum:
            - claude_trigger
          description: Discriminator. Claude Code scheduled-routine trigger.
        name:
          type: string
          minLength: 1
          maxLength: 80
          default: Claude trigger
          description: Human-readable connector label.
        events:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/ConnectorEvent'
          description: Events that auto-fire the routine. Defaults to empty so the trigger does not auto-fire paid runs until events are subscribed.
        config:
          $ref: '#/components/schemas/ClaudeTriggerConfig'
        token:
          type: string
          minLength: 1
          description: The routine's fire bearer token (secret). **Optional** — a tokenless trigger is recorded but not fireable until a token is added later. Encrypted into the credentials cipher; never persisted in `config` or returned.
        enabled:
          type: boolean
          default: true
          description: Whether the trigger is active on create.
      required:
        - provider
        - config
      additionalProperties: false
      description: Create a Claude Code routine trigger in one shot. Idempotent by `config.routineId` — re-creating with the same routine id updates the existing row.
    CursorTriggerRepo:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Repo the cloud agent runs against, e.g. `https://github.com/owner/repo`.
        startingRef:
          type: string
          minLength: 1
          description: Optional branch this repo's runs start from. Omit for the repo's default branch.
      required:
        - url
      additionalProperties: false
      description: One repo a trigger runs against, with the branch its runs start from.
    CursorTriggerConfig:
      type: object
      properties:
        repoUrl:
          type: string
          format: uri
          description: '**First** repo the cloud agent runs against, e.g. `https://github.com/owner/repo`. Idempotency key for the connector, and always a mirror of `repos[0].url` when `repos` is supplied.'
        startingRef:
          type: string
          minLength: 1
          description: Optional git ref the run starts from. Mirrors `repos[0].startingRef`. Pinned onto the Cursor agent at creation, so changing it provisions a replacement agent.
        repos:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CursorTriggerRepo'
          description: Every repo this trigger runs against, each with its own starting branch — Cursor launches ONE agent across the whole set. Omit for a single-repo trigger, which is then described by `repoUrl`/`startingRef` alone; when supplied, the first entry must match them. Changing the set re-provisions the agent (its repos are pinned at creation).
        projectId:
          type: string
          minLength: 1
          description: Shipeasy project id the run targets.
        agentId:
          type: string
          minLength: 1
          description: Server-managed. The reusable Cursor cloud agent (`bc-…`) Shipeasy provisions once at connect and then starts every run on. A supplied value is ignored on create; if Cursor stops recognising the id (404), the next fire provisions a replacement and stores it here.
        fireText:
          type: string
          minLength: 1
          description: Optional standing instruction prepended to every run's prompt — the trigger's base prompt. Lets two triggers on different repos steer their runs differently without changing the `/shipeasy-ops-work` task block.
      required:
        - repoUrl
        - projectId
      additionalProperties: false
      description: Non-secret config for a Cursor trigger.
    CreateCursorTriggerRequest:
      type: object
      properties:
        provider:
          type: string
          enum:
            - cursor_trigger
          description: Discriminator. Cursor cloud-agent trigger.
        name:
          type: string
          minLength: 1
          maxLength: 80
          default: Cursor trigger
          description: Human-readable connector label.
        events:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/ConnectorEvent'
          description: Events that auto-fire a cold cloud-agent run. Defaults to empty.
        config:
          $ref: '#/components/schemas/CursorTriggerConfig'
        apiKey:
          type: string
          minLength: 1
          description: Cursor API key that launches the run (secret). Encrypted into the credentials cipher; never returned.
        opsKey:
          type: string
          minLength: 1
          description: Restricted Shipeasy ops key (secret). Sent as the Bearer for the Shipeasy MCP server handed to each run inline — never in the prompt text or the run env. Encrypted; never returned.
        enabled:
          type: boolean
          default: true
          description: Whether the trigger is active on create.
      required:
        - provider
        - config
        - apiKey
        - opsKey
      additionalProperties: false
      description: Create a Cursor cloud-agent trigger. Both keys are required up front (never tokenless). Idempotent by `config.repoUrl`.
    CopilotTriggerRepo:
      type: object
      properties:
        owner:
          type: string
          minLength: 1
          description: GitHub repo owner.
        repo:
          type: string
          minLength: 1
          description: GitHub repo name.
        baseRef:
          type: string
          minLength: 1
          description: Optional base ref this repo's agent task branches from. Omit for the repo's default branch.
      required:
        - owner
        - repo
      additionalProperties: false
      description: One repo a Copilot trigger runs against, with the base branch its tasks branch from.
    CopilotTriggerConfig:
      type: object
      properties:
        owner:
          type: string
          minLength: 1
          description: '**First** GitHub repo owner. Together with `repo` forms the connector''s idempotency key (`owner/repo`), and both mirror `repos[0]` when `repos` is supplied.'
        repo:
          type: string
          minLength: 1
          description: GitHub repo name.
        baseRef:
          type: string
          minLength: 1
          description: Optional base ref the agent branches from. Mirrors `repos[0].baseRef`.
        repos:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CopilotTriggerRepo'
          description: Every repo this trigger runs against, each with its own base branch. GitHub's agent-tasks API is per-repo, so ONE fire starts one task per entry. Omit for a single-repo trigger, which is then described by `owner`/`repo`/`baseRef` alone; when supplied, the first entry must match them.
        projectId:
          type: string
          minLength: 1
          description: Shipeasy project id the run targets.
        fireText:
          type: string
          minLength: 1
          description: Optional standing instruction prepended to every run's prompt — the trigger's base prompt. Lets two triggers on different repos steer their runs differently without changing the `/shipeasy-ops-work` task block.
      required:
        - owner
        - repo
        - projectId
      additionalProperties: false
      description: Non-secret config for a Copilot trigger.
    CreateCopilotTriggerRequest:
      type: object
      properties:
        provider:
          type: string
          enum:
            - copilot_trigger
          description: Discriminator. GitHub Copilot coding-agent trigger.
        name:
          type: string
          minLength: 1
          maxLength: 80
          default: Copilot trigger
          description: Human-readable connector label.
        events:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/ConnectorEvent'
          description: Events that auto-fire a Copilot agent task. Defaults to empty.
        config:
          $ref: '#/components/schemas/CopilotTriggerConfig'
        token:
          type: string
          minLength: 1
          description: Copilot-licensed user PAT (secret). The ops key lives in the repo's GitHub "Agents" secret store and is never sent through Shipeasy. Encrypted; never returned.
        enabled:
          type: boolean
          default: true
          description: Whether the trigger is active on create.
      required:
        - provider
        - config
        - token
      additionalProperties: false
      description: Create a GitHub Copilot coding-agent trigger. Idempotent by `config.owner/config.repo`.
    JulesTriggerConfig:
      type: object
      properties:
        source:
          type: string
          minLength: 1
          description: Jules source for the connected repo, e.g. `sources/github/owner/repo`. Idempotency key for the connector.
        startingBranch:
          type: string
          minLength: 1
          description: Optional branch the session starts from.
        projectId:
          type: string
          minLength: 1
          description: Shipeasy project id the run targets.
        fireText:
          type: string
          minLength: 1
          description: Optional standing instruction prepended to every run's prompt — the trigger's base prompt. Lets two triggers on different repos steer their runs differently without changing the `/shipeasy-ops-work` task block.
      required:
        - source
        - projectId
      additionalProperties: false
      description: Non-secret config for a Jules trigger.
    CreateJulesTriggerRequest:
      type: object
      properties:
        provider:
          type: string
          enum:
            - jules_trigger
          description: Discriminator. Google Jules trigger.
        name:
          type: string
          minLength: 1
          maxLength: 80
          default: Jules trigger
          description: Human-readable connector label.
        events:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/ConnectorEvent'
          description: Events that auto-fire a Jules session. Defaults to empty.
        config:
          $ref: '#/components/schemas/JulesTriggerConfig'
        apiKey:
          type: string
          minLength: 1
          description: Jules API key that launches the session (secret). Encrypted into the credentials cipher; never returned.
        opsKey:
          type: string
          minLength: 1
          description: Restricted Shipeasy ops key, embedded in the prompt (Jules exposes no env channel) (secret). Encrypted; never returned.
        enabled:
          type: boolean
          default: true
          description: Whether the trigger is active on create.
      required:
        - provider
        - config
        - apiKey
        - opsKey
      additionalProperties: false
      description: Create a Google Jules trigger. Both keys are required up front. Idempotent by `config.source`.
    CreateConnectorRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateOAuthConnectorRequest'
        - $ref: '#/components/schemas/CreateClaudeTriggerRequest'
        - $ref: '#/components/schemas/CreateCursorTriggerRequest'
        - $ref: '#/components/schemas/CreateCopilotTriggerRequest'
        - $ref: '#/components/schemas/CreateJulesTriggerRequest'
      discriminator:
        propertyName: provider
        mapping:
          google_sheets: '#/components/schemas/CreateOAuthConnectorRequest'
          github: '#/components/schemas/CreateOAuthConnectorRequest'
          slack: '#/components/schemas/CreateOAuthConnectorRequest'
          claude_trigger: '#/components/schemas/CreateClaudeTriggerRequest'
          cursor_trigger: '#/components/schemas/CreateCursorTriggerRequest'
          copilot_trigger: '#/components/schemas/CreateCopilotTriggerRequest'
          jules_trigger: '#/components/schemas/CreateJulesTriggerRequest'
      description: Body for `POST /api/admin/connectors`, discriminated on `provider`. The OAuth providers (`google_sheets`/`github`/`slack`) create a disabled stub that is finished via the provider's OAuth flow. The trigger providers (`claude_trigger`/`cursor_trigger`/`copilot_trigger`/`jules_trigger`) arrive config + credentials together and are fireable immediately.
    CreateConnectorResponse:
      type: object
      properties:
        id:
          type: string
          description: Newly assigned connector id.
      required:
        - id
      additionalProperties: false
    DeleteConnectorResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required:
        - ok
      additionalProperties: false
    UpdateConnectorRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: New connector label.
        enabled:
          type: boolean
          description: Toggle the connector on/off.
        events:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorEvent'
          description: Replaces the subscribed-events list wholesale. An empty array unsubscribes the connector from every event (e.g. turning off a trigger's auto-fire).
        config:
          type: object
          additionalProperties: true
          description: Replaces the non-secret config wholesale. Secrets are never set through this endpoint.
      additionalProperties: false
      description: Body for `PATCH /api/admin/connectors/{id}`. Partial — only supplied fields change. Array/object fields (`events`, `config`) replace, not merge.
    UpdateConnectorResponse:
      type: object
      properties:
        id:
          type: string
          description: Connector id that was updated.
      required:
        - id
      additionalProperties: false
      description: Update returns only the id — re-fetch via `GET /api/admin/connectors/{id}` for the full row.
    FireConnectorRequest:
      type: object
      properties:
        text:
          type: string
          description: Optional prompt override for the run. When omitted, each provider falls back to its own default (Claude → the configured `fireText`; the others → their built cold-start prompt).
      additionalProperties: false
      description: Body for `POST /api/admin/connectors/{id}/fire`. Entirely optional — an empty body kicks the run with the provider default.
    FireConnectorResponse:
      type: object
      properties:
        ok:
          type: boolean
          description: Always `true` — a successful fire returns HTTP 200. A dispatch failure returns HTTP 502 with the `Error` envelope, not this body.
      required:
        - ok
      additionalProperties: false
      description: 'Result of a successful trigger fire: `{ ok: true }`. When the downstream dispatch fails the endpoint returns HTTP 502 (see the `Error` response), never `ok: false`.'
    TestConnectorResponse:
      type: object
      properties:
        ok:
          type: boolean
          description: Always `true` — a successful test returns HTTP 200. A dispatch failure returns HTTP 502 with the `Error` envelope, not this body.
        issueUrl:
          anyOf:
            - type: string
            - type: 'null'
          description: URL of the artifact the test produced (e.g. the GitHub Issue created by a `github` connector), or `null` when the provider produces no linkable artifact.
      required:
        - ok
        - issueUrl
      additionalProperties: false
      description: 'Result of a successful connector test: `{ ok: true, issueUrl }`. When the downstream dispatch fails the endpoint returns HTTP 502 (see the `Error` response), never `ok: false`.'
    UpdateClaudeTriggerRequest:
      type: object
      properties:
        provider:
          type: string
          enum:
            - claude_trigger
          description: Discriminator. Claude Code scheduled-routine trigger.
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: New connector label. Optional — omit to leave it unchanged.
        config:
          $ref: '#/components/schemas/ClaudeTriggerConfig'
        token:
          type: string
          minLength: 1
          description: New fire bearer token (secret). Optional — a blank/omitted token leaves the stored cipher untouched; a supplied one replaces it. Encrypted; never returned.
      required:
        - provider
        - config
      additionalProperties: false
      description: Per-provider PATCH body for editing an existing `claude_trigger` connector (the dashboard "Triggers" tab). The non-secret `config` is always supplied and replaces the stored config wholesale; `name` and `token` are optional.
    UpdateCursorTriggerRequest:
      type: object
      properties:
        provider:
          type: string
          enum:
            - cursor_trigger
          description: Discriminator. Cursor cloud-agent trigger.
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: New connector label. Optional — omit to leave it unchanged.
        config:
          $ref: '#/components/schemas/CursorTriggerConfig'
        apiKey:
          type: string
          minLength: 1
          description: New Cursor launch key (secret). Optional — omit to leave the stored key untouched. Rotatable independently of `opsKey`. Encrypted; never returned.
        opsKey:
          type: string
          minLength: 1
          description: New restricted Shipeasy ops key (secret). Optional — omit to leave the stored key untouched. Rotatable independently of `apiKey`. Encrypted; never returned.
      required:
        - provider
        - config
      additionalProperties: false
      description: 'Per-provider PATCH body for editing an existing `cursor_trigger` connector. `config` replaces the stored config wholesale, except for the server-managed keys: the provisioned `agentId` is carried over (and dropped, so a replacement agent is provisioned, when `repoUrl`/`startingRef` change), as is the last-run pointer. `name` and either credential are optional (a supplied credential rotates just that key).'
    UpdateCopilotTriggerRequest:
      type: object
      properties:
        provider:
          type: string
          enum:
            - copilot_trigger
          description: Discriminator. GitHub Copilot coding-agent trigger.
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: New connector label. Optional — omit to leave it unchanged.
        config:
          $ref: '#/components/schemas/CopilotTriggerConfig'
        token:
          type: string
          minLength: 1
          description: New Copilot-licensed user PAT (secret). Optional — omit to leave the stored cipher untouched. Encrypted; never returned.
      required:
        - provider
        - config
      additionalProperties: false
      description: Per-provider PATCH body for editing an existing `copilot_trigger` connector. `config` replaces the stored config wholesale; `name` and `token` are optional.
    UpdateJulesTriggerRequest:
      type: object
      properties:
        provider:
          type: string
          enum:
            - jules_trigger
          description: Discriminator. Google Jules trigger.
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: New connector label. Optional — omit to leave it unchanged.
        config:
          $ref: '#/components/schemas/JulesTriggerConfig'
        apiKey:
          type: string
          minLength: 1
          description: New Jules launch key (secret). Optional — omit to leave the stored key untouched. Rotatable independently of `opsKey`. Encrypted; never returned.
        opsKey:
          type: string
          minLength: 1
          description: New restricted Shipeasy ops key (secret). Optional — omit to leave the stored key untouched. Rotatable independently of `apiKey`. Encrypted; never returned.
      required:
        - provider
        - config
      additionalProperties: false
      description: Per-provider PATCH body for editing an existing `jules_trigger` connector. `config` replaces the stored config wholesale; `name` and either credential are optional.
    UpdateTriggerConnectorRequest:
      oneOf:
        - $ref: '#/components/schemas/UpdateClaudeTriggerRequest'
        - $ref: '#/components/schemas/UpdateCursorTriggerRequest'
        - $ref: '#/components/schemas/UpdateCopilotTriggerRequest'
        - $ref: '#/components/schemas/UpdateJulesTriggerRequest'
      discriminator:
        propertyName: provider
        mapping:
          claude_trigger: '#/components/schemas/UpdateClaudeTriggerRequest'
          cursor_trigger: '#/components/schemas/UpdateCursorTriggerRequest'
          copilot_trigger: '#/components/schemas/UpdateCopilotTriggerRequest'
          jules_trigger: '#/components/schemas/UpdateJulesTriggerRequest'
      description: 'Body for `PATCH /api/admin/connectors/{id}/trigger`, discriminated on `provider`. Edits an existing trigger connector: the non-secret `config` is always supplied and replaces the stored config wholesale; `name` and the credential secret(s) are optional (a supplied secret rotates just that key, a blank/omitted one leaves the stored cipher untouched).'
    CreateTriggerConnectorRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateClaudeTriggerRequest'
        - $ref: '#/components/schemas/CreateCursorTriggerRequest'
        - $ref: '#/components/schemas/CreateCopilotTriggerRequest'
        - $ref: '#/components/schemas/CreateJulesTriggerRequest'
      discriminator:
        propertyName: provider
        mapping:
          claude_trigger: '#/components/schemas/CreateClaudeTriggerRequest'
          cursor_trigger: '#/components/schemas/CreateCursorTriggerRequest'
          copilot_trigger: '#/components/schemas/CreateCopilotTriggerRequest'
          jules_trigger: '#/components/schemas/CreateJulesTriggerRequest'
      description: Body for `POST /api/admin/connectors/trigger`, discriminated on `provider` — the trigger-provider subset of `CreateConnectorRequest` (no OAuth stubs). Config + credentials arrive together and the connector is usable immediately; creates are idempotent by each provider's natural key (`config.routineId` / `config.repoUrl` / `config.owner`+`config.repo` / `config.source`).
    KeyRecord:
      type: object
      description: A single API key as returned by the list endpoint. Response fields are snake_case. The raw token is never returned here — only its `last4` tail. `last4` and the typed `scopes` may be `null` for keys minted before those columns existed.
      properties:
        id:
          type: string
          description: Stable opaque key id (UUID). Use it to revoke the key.
        type:
          type: string
          enum:
            - server
            - client
            - admin
            - ops
          description: Key kind. `server` (back-end, full SDK auth), `client` (public, browser-embeddable), `admin` (CLI/devtools auth token), `ops` (restricted unattended-trigger credential).
        env:
          type: string
          enum:
            - dev
            - staging
            - prod
          description: Environment the key is bound to. The worker derives the read env from the key, so this is the isolation boundary. `admin`/`ops` keys are env-agnostic and pinned to `prod`.
        created_at:
          type: string
          description: ISO-8601 timestamp the key was minted.
        revoked_at:
          anyOf:
            - type: string
            - type: 'null'
          description: ISO-8601 timestamp the key was revoked, or `null` while the key is active.
        expires_at:
          anyOf:
            - type: string
            - type: 'null'
          description: ISO-8601 expiry, or `null` for a key that never expires. `admin` keys are fixed at 90 days; `ops` keys use a short sliding window.
        created_by_email:
          anyOf:
            - type: string
            - type: 'null'
          description: Email of the human or actor that minted the key, or `null` when not attributable (e.g. CLI device-flow).
        name:
          anyOf:
            - type: string
            - type: 'null'
          description: Human label for the key. `null` for unnamed dashboard mints; programmatic mints auto-name themselves.
        description:
          anyOf:
            - type: string
            - type: 'null'
          description: Free-text note recording what the key is for (the service that holds it, the rotation owner, the ticket it was minted under). Display only — `null` unless someone set it via `PATCH /api/admin/keys/{id}`.
        scopes:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
          description: Permission strings recorded on the key for audit/display, or `null` when none were set.
        last4:
          anyOf:
            - type: string
            - type: 'null'
          description: Last 4 characters of the raw token, so the dashboard mask is matchable against the held key. `null` for keys minted before this column.
      required:
        - id
        - type
        - env
        - created_at
        - revoked_at
        - expires_at
        - created_by_email
        - name
        - description
        - scopes
        - last4
      additionalProperties: false
    ListKeysResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/KeyRecord'
        next_cursor:
          anyOf:
            - type: string
            - type: 'null'
          description: Opaque cursor for the next page, or `null` on the last page. Pass it back as the `cursor` query parameter.
      required:
        - data
        - next_cursor
      additionalProperties: false
      description: One page of API keys plus a keyset `next_cursor` (ordered `created_at desc, id desc`).
    CreateKeyRequest:
      type: object
      description: |-
        Body for `POST /api/admin/keys`. Only `type` is required.

        `env` is **required** for `server` and `client` keys (the key is bound to one environment — that binding is the read-env isolation boundary). For `admin` and `ops` keys `env` is ignored and the key is pinned to `prod`.
      properties:
        type:
          type: string
          enum:
            - server
            - client
            - admin
            - ops
          description: Key kind to mint. `server` (back-end), `client` (public, browser), `admin` (CLI/devtools token), `ops` (restricted unattended-trigger credential). `admin`/`ops` keys don't count toward the plan key limit.
        name:
          type: string
          minLength: 1
          maxLength: 160
          description: Optional human label. Programmatic (API) mints that omit it get an auto-generated descriptive name; dashboard mints may leave it blank. The cap is generous because provenance labels are composed, not typed — `shipeasy setup` mints keys named with the stack, package, date, and operator that produced them, which does not fit in a one-line-input budget.
        scopes:
          type: array
          items:
            type: string
            enum:
              - experiments:read
              - gates:evaluate
              - events:write
              - configs:write
              - experiments:write
              - tickets:public_create
          description: 'Optional permission strings recorded on the key. `tickets:public_create` is enforced: a client key needs it (plus the project''s `allowPublicTickets` setting) to file a `pending_approval` bug via the public `POST /cli/report` endpoint. The rest are audit/display only.'
        expiresInDays:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 3650
            - type: 'null'
          description: Days until the key expires (1–3650), or `null`/omitted for a key that never expires. Ignored for `admin` keys (fixed 90-day expiry) and `ops` keys (short sliding window).
        env:
          type: string
          enum:
            - dev
            - staging
            - prod
          description: Environment to bind the key to. Always required. For `server`/`client` keys it is the isolation boundary the worker reads from; `admin`/`ops` keys are env-agnostic and pinned to `prod` by the handler regardless of the value sent.
      required:
        - type
        - env
      additionalProperties: false
    CreateKeyResponse:
      type: object
      description: The minted key. The plaintext `key` is returned **once**, here — it is stored hashed and can never be retrieved again.
      properties:
        id:
          type: string
          description: Stable opaque key id (UUID). Use it to revoke the key.
        type:
          type: string
          enum:
            - server
            - client
            - admin
            - ops
          description: The kind of key that was minted.
        env:
          type: string
          enum:
            - dev
            - staging
            - prod
          description: Environment the key is bound to (`prod` for `admin`/`ops`).
        key:
          type: string
          description: The plaintext API token (e.g. `sdk_server_…`). Returned once — store it now; it cannot be recovered.
        expires_at:
          anyOf:
            - type: string
            - type: 'null'
          description: ISO-8601 expiry, or `null` if the key never expires.
      required:
        - id
        - type
        - env
        - key
        - expires_at
      additionalProperties: false
    UpdateKeyRequest:
      type: object
      description: |-
        Body for `PATCH /api/admin/keys/{id}`. Only the key's **label** is editable — `name` and `description`.

        Everything that gives a key its authority (`type`, `env`, `scopes`, `expires_at`) is fixed at mint: those are the isolation boundary the worker derives the read env and permissions from, so changing them would silently re-point a credential that is already deployed. Rotate instead — mint a replacement and revoke the old key.

        Omitted fields are left untouched; send `null` to clear one.
      properties:
        name:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 160
            - type: 'null'
          description: New human label, or `null` to clear it. Same 160-char budget as create — provenance labels are composed, not typed.
        description:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 500
            - type: 'null'
          description: New free-text note, or `null` to clear it.
      additionalProperties: false
    RevokeKeyResponse:
      type: object
      description: Confirms the key is revoked. Idempotent — revoking an already-revoked key returns the same shape.
      properties:
        id:
          type: string
          description: Id of the key that was revoked.
        revoked:
          type: boolean
          const: true
      required:
        - id
        - revoked
      additionalProperties: false
    SearchHit:
      type: object
      description: A single universal-search hit. Field names are camelCase; `title` is `null` when the resource has no human title/display name (members fall back to a role label).
      properties:
        type:
          type: string
          enum:
            - member
            - gate
            - experiment
            - config
            - killswitch
            - metric
          description: Resource family — drives the result group + icon in the palette. (`member` hits are surfaced first.)
        id:
          type: string
          description: Stable identifier used to deep-link into the row's detail pane. For `member` hits this is the teammate's email; for everything else it is the resource id.
        name:
          type: string
          description: The matched handle — the resource's immutable `name`, or the member's display name (falling back to email).
        title:
          anyOf:
            - type: string
            - type: 'null'
          description: Human title/display name when present, else `null`. For `member` hits this carries the email (or the `Owner`/`Member` role when no profile name is set).
        href:
          type: string
          description: Project-relative href that opens the row (e.g. `/gates?open=<id>`).
      required:
        - type
        - id
        - name
        - title
        - href
      additionalProperties: false
    SearchResponse:
      type: object
      description: Flat, ranked-by-type list of search hits the command palette groups for display. Capped per resource family so one noisy type can't crowd out the rest.
      properties:
        hits:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
      required:
        - hits
      additionalProperties: false
  responses:
    BadRequest:
      description: The request was malformed (bad JSON or missing project scope).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            BAD_REQUEST:
              summary: Malformed request
              value:
                error: Malformed request (bad JSON, missing project scope).
                code: BAD_REQUEST
    Unauthorized:
      description: Missing or invalid admin SDK key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            UNAUTHORIZED:
              summary: No / invalid key
              value:
                error: Missing or invalid admin SDK key.
                code: UNAUTHORIZED
    Forbidden:
      description: The key is valid but not allowed to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            FORBIDDEN:
              summary: Not an admin of this project
              value:
                error: Key is valid but not allowed to act on this project.
                code: FORBIDDEN
            PLAN_REQUIRED:
              summary: Feature gated behind a higher plan
              value:
                error: The requested feature requires a higher plan tier (e.g. sequential testing, custom alpha, holdout, group count).
                code: PLAN_REQUIRED
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            NOT_FOUND:
              summary: Unknown id or name
              value:
                error: The resource does not exist or is not visible to the caller.
                code: NOT_FOUND
    Conflict:
      description: The mutation conflicts with current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            ALREADY_EXISTS:
              summary: Duplicate name
              value:
                error: A resource with this name already exists in the project.
                code: ALREADY_EXISTS
            REFERENCED_IN_USE:
              summary: Still referenced by another resource
              value:
                error: The resource cannot be archived/deleted while another resource still references it.
                code: REFERENCED_IN_USE
            INVALID_TRANSITION:
              summary: Illegal lifecycle transition
              value:
                error: The requested lifecycle transition is not allowed from the current state.
                code: INVALID_TRANSITION
            IMMUTABLE_FIELD:
              summary: Edited an immutable field while running
              value:
                error: A field that is immutable in the current state was modified (e.g. editing allocation while running).
                code: IMMUTABLE_FIELD
    UnprocessableEntity:
      description: The request body failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            VALIDATION:
              summary: Schema validation failed
              value:
                error: The request body failed structural (schema) validation.
                code: VALIDATION
            REFERENCED_NOT_FOUND:
              summary: Referenced entity missing
              value:
                error: A referenced entity (universe, metric, gate, event) does not exist.
                code: REFERENCED_NOT_FOUND
            GROUPS_WEIGHT_SUM:
              summary: Group weights must sum to 10000
              value:
                error: Experiment group weights must sum to 10000 (basis points).
                code: GROUPS_WEIGHT_SUM
            EVENT_PENDING:
              summary: Event still pending review
              value:
                error: The referenced event is still pending review and cannot back a metric yet.
                code: EVENT_PENDING
    PayloadTooLarge:
      description: The request body exceeded the intake's fixed size cap (16 KB).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            BAD_REQUEST:
              summary: Body too large
              value:
                error: Body too large
                code: BAD_REQUEST
    TooManyRequests:
      description: |-
        The public intake is rate-limited per (project, client IP). Back off and retry;
        the limit is a burst guard, not a quota, so a modest delay clears it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            BAD_REQUEST:
              summary: Rate limited
              value:
                error: Too many requests
                code: BAD_REQUEST
    ServiceUnavailable:
      description: |-
        A backing store the endpoint needs is not bound in this environment. Transient
        and infrastructural — no stable `ErrorCode` is assigned, so `code` is omitted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            UNAVAILABLE:
              summary: Storage unbound
              value:
                error: Unavailable
    BadGateway:
      description: |-
        The request was well-formed and the resource exists, but a downstream provider
        the endpoint delegates to (e.g. a connector's Slack/GitHub/cloud-agent dispatch)
        failed. The failure is upstream of this API, not a client error. No stable
        `ErrorCode` is assigned to upstream failures, so `code` is omitted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            UPSTREAM_FAILURE:
              summary: Downstream provider dispatch failed
              value:
                error: 'GitHub API responded 403: resource not accessible by integration.'
