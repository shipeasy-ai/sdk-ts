      properties:
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
          description: Attribute key (lowercase alphanumeric start, then letters/digits/`_`/`-`; max 64 chars). Immutable after create.
        type:
          $ref: '#/components/schemas/AttributeType'
        enum_values:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
          default: null
          description: Allowed values when `type` is `enum` (required in that case — 422 otherwise); `null` for non-enum types.
        required:
          type: boolean
          default: false
          description: Whether the attribute must be present on the evaluation context.
        description:
          type: string
          description: Optional human note shown in the dashboard.
        sdk_path:
          type: string
          description: Optional dotted path the SDK reads the value from.
      required:
        - name
        - type
      additionalProperties: false
      description: Body for `POST /api/admin/attributes`. Declares a targeting attribute.
    CreateAttributeResponse:
      type: object
      properties:
        id:
          type: string
          description: Newly assigned attribute id.
        name:
          type: string
          description: The attribute key that was created.
      required:
        - id
        - name
      additionalProperties: false
      description: Response for `POST /api/admin/attributes`.
    GetAttributeResponse:
      type: object
      properties:
        id:
          type: string
          description: Stable opaque attribute id.
        name:
          type: string
          description: Attribute key.
        type:
          $ref: '#/components/schemas/AttributeType'
        enumValues:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
          description: Allowed values for `enum` attributes, else `null`.
        required:
          type: integer
          enum:
            - 0
            - 1
          description: Whether the attribute is required (D1 stores the flag as `0`/`1`).
        description:
          anyOf:
            - type: string
            - type: 'null'
          description: Human note, or `null`.
        sdkPath:
          anyOf:
            - type: string
            - type: 'null'
          description: Dotted SDK path, or `null`.
        createdAt:
          type: string
          description: ISO-8601 creation timestamp.
      required:
        - id
        - name
        - type
      additionalProperties: {}
      description: One targeting attribute row.
    DeleteAttributeResponse:
      type: object
      properties:
        ok:
          type: boolean
          description: True when the attribute was archived.
      required:
        - ok
      additionalProperties: false
      description: Response for `DELETE /api/admin/attributes/{id}`.
    UpdateAttributeRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AttributeType'
        enum_values:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
          description: Replacement allowed values (for `enum`), or `null` to clear.
        required:
          type: boolean
          description: Whether the attribute must be present on the evaluation context.
        description:
          type: string
          description: Optional human note shown in the dashboard.
        sdk_path:
          type: string
          description: Optional dotted path the SDK reads the value from.
      additionalProperties: false
      description: Body for `PATCH /api/admin/attributes/{id}`. Every field is optional; `name` is immutable.
    UpdateAttributeResponse:
      type: object
      properties:
        id:
          type: string
          description: Id of the attribute that was updated.
      required:
        - id
      additionalProperties: false
      description: Response for `PATCH /api/admin/attributes/{id}`.
    MetricDisplayConfig:
      description: How the metric's series is DRAWN, as opposed to what it measures. Both parts used to be DSL functions (`expected(q, seasonal)`, `forecast(q, …)`), which meant turning a band on minted a different metric; they are properties now, so every chart of the metric picks them up and nothing that JUDGES the metric — an alert rule, the experiment analyzer — reads them at all.
      type: object
      properties:
        band:
          description: Shade the seasonal baseline around the series. The fit is the median of this hour of the week over the four weeks before the window, and it is the SAME fit an `anomaly` alert rule fires on — so the shaded region is exactly where such a rule would stay quiet, whether or not one exists.
          type: object
          properties:
            method:
              type: string
              enum:
                - seasonal
            sigma:
              type: number
              exclusiveMinimum: 0
              description: Half-width of the band in sigma-equivalents. Omit for 3, the sigma an alert rule also defaults to.
          required:
            - method
          additionalProperties: false
        forecast:
          description: Project the series past the end of the window. Projected buckets are marked, so a chart can draw an estimate differently from a measurement.
          type: object
          properties:
            method:
              type: string
              enum:
                - linear
                - seasonal
              description: '`linear` continues a least-squares slope over the window it is already reading. `seasonal` de-seasonalises against the four weeks before the window, fits the trend on the remainder and adds the hour-of-week term back — ask for it when the metric has a shape.'
            horizon:
              type: integer
              minimum: 1
              maximum: 500
              description: Buckets to project. Omit for a quarter of the window, which is the same claim at every bucket width.
          required:
            - method
          additionalProperties: false
      additionalProperties: false
    QueryIr:
      description: |-
        A metric definition as a typed expression tree — the structured alternative to the `query` DSL string, and what the API stores. Exactly one of `query` / `query_ir` is supplied per metric body; `query` is the same definition written as text, and is the spelling to prefer.
        Until 2026-08-10 this documented a single aggregation (`{agg, metric, filters}`, with `ratio` as a special case). That shape no longer exists — stored metrics were migrated and the code that read it was deleted — so a body sending it is rejected. Send the `query` string instead, or the tree below.
      type: object
      properties:
        v:
          type: integer
          const: 2
          description: Storage version of the definition. `2` is the only one.
        expr:
          type: object
          additionalProperties: true
          description: |-
            The expression tree: aggregate leaves (`{node: "agg", event, agg, filters, valueLabel?}`), arithmetic over them (`{node: "binary", op, left, right}`), scalars, and function calls (`{node: "call", fn, arg, params?}`). A ratio is ordinary division of two leaves.
            Deliberately opaque here rather than mirrored node by node: the grammar belongs to the query language, a second copy of it in this spec would drift from the one the server enforces, and the server validates every tree by planning it before the metric saves. `GET /api/admin/metrics` returns the grammar itself; the `query` string is the same tree in the form humans and the CLI write.
        groupBy:
          type: object
          properties:
            op:
              type: string
              enum:
                - by
                - without
              description: '`by` names the output dimensions; `without` names the ones to drop.'
            labels:
              type: array
              maxItems: 8
              items:
                type: string
                pattern: ^[a-z_][a-z0-9_]{0,63}$
                description: Event property / label identifier.
              description: Labels the grouping names.
          required:
            - op
            - labels
          additionalProperties: false
          description: How the series is split. On the envelope rather than in `expr` because every leaf of one expression shares it.
        display:
          $ref: '#/components/schemas/MetricDisplayConfig'
      required:
        - v
        - expr
      additionalProperties: false
    ListMetricsResponse:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            description: Stable opaque metric id.
          name:
            type: string
            description: Metric key.
          folder:
            anyOf:
              - type: string
              - type: 'null'
            description: Folder grouping the metric, or `null`.
          eventName:
            type: string
            description: Source event name (camelCase in response).
          query:
            description: Rendered DSL text form of the query, or `null` if it could not be rendered.
            anyOf:
              - type: string
              - type: 'null'
          queryIr:
            description: Typed query IR, or `null` for a metric whose IR was never populated (re-save it to backfill).
            anyOf:
              - $ref: '#/components/schemas/QueryIr'
              - type: 'null'
          displayName:
            description: Human-friendly display name shown in the dashboard, or `null` to fall back to `name`.
            anyOf:
              - type: string
              - type: 'null'
          presetId:
            description: Id of the metric preset this metric was created from, or `null` for a custom metric.
            anyOf:
              - type: string
              - type: 'null'
          unit:
            description: Display unit (e.g. `ms`, `%`, `$`), or `null` when unitless.
            anyOf:
              - type: string
              - type: 'null'
          version:
            type: integer
            description: Monotonic save counter — incremented on every update.
          deletedAt:
            description: ISO-8601 soft-delete (archive) timestamp, or `null` while the metric is live.
            anyOf:
              - type: string
              - type: 'null'
          creatorEmail:
            description: Email of the user who created the metric, or `null` when unknown. List responses only.
            anyOf:
              - type: string
              - type: 'null'
          updaterEmail:
            description: Email of the user who last edited the metric, or `null` when unknown. List responses only.
            anyOf:
              - type: string
              - type: 'null'
          direction:
            type: string
            enum:
              - higher_better
              - lower_better
              - neutral
            description: Desired direction of movement. `higher_better` (default), `lower_better`, or `neutral` (guardrail).
          winsorizePct:
            description: Winsorise percentile applied to the metric.
            type: number
          defaultMinEffectOfInterest:
            description: Metric-level default minimum effect of interest (relative, 0–1), or `null`.
            anyOf:
              - type: number
              - type: 'null'
          createdAt:
            description: ISO-8601 creation timestamp, or `null` on legacy rows created before the column existed.
            anyOf:
              - type: string
              - type: 'null'
          updatedAt:
            description: ISO-8601 last-update timestamp.
            type: string
        required:
          - id
          - name
          - folder
          - eventName
          - query
          - queryIr
          - version
          - displayName
          - presetId
          - unit
          - deletedAt
        additionalProperties: {}
        description: A metric definition.
      description: Every metric in the project (the list endpoint is not paginated).
    MetricDisplayName:
      description: 'What a human calls the metric — "Checkout revenue" beside the `checkout.revenue` that identifies it. Unlike `name` it is free text, it is editable, and nothing addresses the metric by it: the dashboard leads with it and falls back to `name` when it is absent, so a metric nobody named simply reads as its key. Send `null` to clear it.'
      maxLength: 200
      anyOf:
        - type: string
        - type: 'null'
    MetricEventName:
      type: string
      minLength: 1
      description: Source event the query reads from.
    MetricQueryDsl:
      description: Metric query DSL string, e.g. `sum(purchase, amount)`. The alternative to `query_ir`. Every label the query references — in filters, the value position, `by (…)`, or `without (…)` — must exist as a property on the tracked event's payload; a query over a label the event never carries validates fine but returns empty results.
      type: string
      minLength: 1
      maxLength: 4096
    MetricWinsorizePct:
      default: 99
      description: Winsorise percentile (1–99) to clamp outliers. Defaults to 99.
      type: integer
      minimum: 1
      maximum: 99
    MetricDefaultMinEffectOfInterest:
      default: null
      description: Default minimum effect of interest (relative, 0–1) — the smallest change in this metric worth acting on, used as the power-planning baseline. Intrinsic to the metric; an experiment overrides it per-attachment with `min_effect_of_interest` when a specific decision has a different cost/risk bar. `null` to omit.
      anyOf:
        - type: number
        - type: 'null'
    MetricDirection:
      default: higher_better
      type: string
      enum:
        - higher_better
        - lower_better
        - neutral
      description: Desired direction of movement. `higher_better` (default), `lower_better`, or `neutral` (guardrail).
    MetricDisplayUnit:
      description: Display unit (e.g. `ms`, `%`, `$`), or `null` when unitless.
      anyOf:
        - type: string
        - type: 'null'
    CreateMetricWithQuery:
      type: object
