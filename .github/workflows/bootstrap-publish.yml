name: Bootstrap publish (one-time, token auth)

# ONE-TIME setup for a NEW package name, then never again.
#
# Why this exists: npm will not let you attach a Trusted Publisher (OIDC) rule to
# a package that does not exist yet, and OIDC cannot perform a package's FIRST
# publish. So every new name needs exactly one token-authenticated publish to
# bring it into existence; after that you add its Trusted Publisher rule and the
# regular release-gated publish.yml (OIDC, no token) takes over forever.
#
# This runs in CI rather than from a laptop on purpose — publishing from a local
# checkout is forbidden (see CLAUDE.md).
#
# HOW TO USE
#   1. Actions -> "Bootstrap publish" -> Run workflow -> type the package
#      directory (e.g. `next`), or `all` for every unpublished one.
#      Auth comes from the repo's existing NPM_TOKEN secret (predates trusted
#      publishing). If it has expired or lacks write on the @shipeasy scope,
#      mint a granular token with a short expiry and set NPM_BOOTSTRAP_TOKEN,
#      which takes precedence.
#   2. On npmjs.com/package/<name>/access add the Trusted Publisher:
#         repository  shipeasy-ai/sdk-ts
#         workflow    publish.yml
#   3. If you had to create NPM_BOOTSTRAP_TOKEN, delete the secret and revoke
#      the token now — from here on every release is OIDC via publish.yml.
#
# Already-published names are skipped, so a re-run is safe.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package dir under packages/ to bootstrap, or 'all'"
        required: true
        default: "all"

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --include-workspace-root run type-check
      - run: pnpm -r --include-workspace-root run test
      - run: pnpm -r --include-workspace-root run build

      - name: Publish unpublished packages with token auth
        env:
          # Prefer a purpose-made short-lived token when present; otherwise fall
          # back to the repo's long-standing NPM_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN || secrets.NPM_TOKEN }}
          TARGET: ${{ inputs.package }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Neither NPM_BOOTSTRAP_TOKEN nor NPM_TOKEN is set — see the header of this workflow."
            exit 1
          fi
          # Fail early and legibly if the token is expired or wrong-scoped,
          # rather than midway through a multi-package loop.
          if ! npm whoami >/dev/null 2>&1; then
            echo "::error::npm rejected the token (expired, revoked, or not scoped to @shipeasy). Mint a granular token with read+write on the @shipeasy scope and set NPM_BOOTSTRAP_TOKEN."
            exit 1
          fi
          echo "Authenticated to npm as $(npm whoami)"
          # devtools-core first: react-native-devtools depends on it by exact version.
          ALL="devtools-core react-native-devtools next openfeature"
          [ "$TARGET" = "all" ] && LIST="$ALL" || LIST="$TARGET"
          for pkg in $LIST; do
            dir="packages/$pkg"
            if [ ! -f "$dir/package.json" ]; then
              echo "::error::No such package dir: $dir"; exit 1
            fi
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            private=$(node -p "require('./$dir/package.json').private === true")
            if [ "$private" = "true" ]; then
              echo "Skipping $name — private, ships as the hosted se-devtools.js"
              continue
            fi
            if npm view "$name" version >/dev/null 2>&1; then
              echo "Skipping $name — already exists; use publish.yml (OIDC) from here on"
              continue
            fi
            echo "Bootstrapping $name@$version"
            # No --provenance: that is an OIDC feature. Later OIDC releases get it.
            (cd "$dir" && npm publish --access public)
          done

      - name: Next steps
        run: |
          echo "Add a Trusted Publisher (repo shipeasy-ai/sdk-ts, workflow publish.yml)"
          echo "on npmjs.com for each package published above, then DELETE the"
          echo "NPM_BOOTSTRAP_TOKEN secret and revoke the token."
