name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

# Lock to one publish at a time so a rapid double-tag can't race the npm
# version bump and the R2 upload out of order.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # npm Trusted Publishing (OIDC, no token) requires npm >= 11.5.1.
      # Node 22 ships with npm 10.x which falls back to NODE_AUTH_TOKEN.
      # Pinned, not @latest: npm 11.6.x ships without its sigstore dep, so
      # `npm publish --provenance` dies with "Cannot find module 'sigstore'".
      - name: Upgrade npm
        run: npm install -g npm@11.5.2

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --include-workspace-root run type-check
      - run: pnpm -r --include-workspace-root run test
      - run: pnpm -r --include-workspace-root run build

      # ----- npm -----
      # Trusted Publishing via OIDC — no token required. Requires a matching
      # Trusted Publisher rule on
      # https://www.npmjs.com/package/@shipeasy/sdk/access (Settings →
      # Trusted Publishers → GitHub Actions, repo shipeasy-ai/sdk-ts, workflow
      # publish.yml).
      #
      # The drop-in <script> loader artifact (R2 upload) is published from the
      # private shipeasy monorepo on submodule bump — keeping CF account id /
      # API token out of this public repo.
      - name: Publish @shipeasy/sdk to npm
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@shipeasy/sdk@$PKG_VERSION" version 2>/dev/null | grep -q "$PKG_VERSION"; then
            echo "Already published: @shipeasy/sdk@$PKG_VERSION"
          else
            npm publish --access public --provenance
          fi

      # Every integration that needs a peer dependency ships as its own package,
      # which is what keeps @shipeasy/sdk itself at ZERO peers. Published AFTER
      # the SDK — all of them declare it as a peer. Each needs its own Trusted
      # Publisher rule (repo shipeasy-ai/sdk-ts, workflow publish.yml) on
      # npmjs.com/package/<name>/access.
      #
      # Order matters: devtools-core before react-native-devtools, which depends
      # on it by exact version.
      #
      # @shipeasy/browser-devtools is deliberately NOT here: it is private and
      # ships as the hosted se-devtools.js script, built by the shipeasy monorepo.
      - name: Publish the satellite packages to npm
        run: |
          for pkg in devtools-core react-native-devtools next openfeature; do
            dir="packages/$pkg"
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version 2>/dev/null | grep -q "$version"; then
              echo "Already published: $name@$version"
            else
              (cd "$dir" && npm publish --access public --provenance)
            fi
          done
