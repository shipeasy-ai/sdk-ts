name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The dev toolchain (vitest 5, jsdom 31, tsup 9) requires Node
        # ^22.12 || ^24 || >=26, so Node 20 (EOL 2026-04) cannot run the
        # suite. package.json "engines" is the consumer contract and is
        # tracked separately.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `-r` covers the SDK itself plus the devtools workspace packages
      # (devtools-core, browser-devtools, react-native-devtools), in
      # topological order.
      - run: pnpm -r --include-workspace-root run type-check

      - run: pnpm -r --include-workspace-root run build

      - run: pnpm -r --include-workspace-root run test

  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: README is generated from docs/ — check it's in sync
        run: |
          pnpm run gen:readme
          git diff --exit-code README.md \
            || { echo "::error::README.md is out of date — run 'pnpm run gen:readme' and commit."; exit 1; }
